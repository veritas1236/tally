const main = $("#main");
main.addEventListener("click", e => {
  const tgt = e.target;
  if (tgt.closest("#clearEx")) {
    S.tasks = S.tasks.filter(t => !t.example);
    const exLists = new Set(S.lists.filter(l => l.example).map(l => l.id));
    S.lists = S.lists.filter(l => !l.example);
    S.tasks.forEach(t => { if (exLists.has(t.listId)) t.listId = "inbox"; });
    return commit();
  }
  if (tgt.closest("#doneToggle")) { ui.showDone = !ui.showDone; return commit(); }
  const on_ = tgt.closest("[data-opennote]"); if (on_) { const id = on_.dataset.opennote; setView("notes"); ui.noteSel = id; return render(); }
  if (tgt.closest("#moveYes")) return doMove();
  if (tgt.closest("#moveNo")) return skipMove();
  const cn = tgt.closest("[data-cal]"); if (cn) return calNav(cn.dataset.cal);
  const ks = tgt.closest("[data-kind-set]"); if (ks) { ui.calKind = ks.dataset.kindSet; ui.sel = null; return commit(); }
  if (tgt.closest("[data-tray]")) { ui.trayAll = !ui.trayAll; return render(); }
  const pk = tgt.closest("[data-pick]"); if (pk) return planFor(pk.dataset.pick, ui.calDay);
  const ev = tgt.closest(".ev"); if (ev) { ui.calDay = ev.dataset.date; return openTask(ev.dataset.id); }
  const cell = tgt.closest(".cell"); if (cell) return selectDay(cell.dataset.date);
  const row = tgt.closest(".row");
  if (!row) {
    if (ui.sel && !tgt.closest(".tools,.adder,form,.pop,.top,.cal-bar")) closeCard();
    return;
  }
  const t = taskById(row.dataset.id); if (!t) return;
  const actEl = tgt.closest("[data-act]"), act = actEl?.dataset.act;
  if (!row.classList.contains("open")) {
    if (act === "toggle") return toggleDone(t);
    if (act === "star") { t.important = !t.important; return commit(); }
    return openTask(t.id);
  }
  if (act) cardAct(t, act, actEl, e);
});

function cardAct(t, act, el, e){
  if (act !== "delete") ui.delArm = null;
  const stepEl = el.closest("[data-step]");
  const step = stepEl && t.steps.find(s => s.id === stepEl.dataset.step);
  const autoCal = () => { if (!t.gcal && isDesktop && G.connected && G.autoAdd && t.due) setTimeout(() => calAdd(t, {silent:true})); };
  switch (act) {
    case "close": return closeCard();
    case "toggle": return toggleDone(t);
    case "star": t.important = !t.important; break;
    case "planToday": t.plan = today(); break;
    case "clearPlan": e.stopPropagation(); t.plan = null; ui.planEdit = false; break;
    case "pickPlan": {
      const inp = $("#ePlan"); if (!inp) return;
      if (!inp.value) inp.value = today();
      try { inp.showPicker(); } catch(x) { ui.planEdit = true; render(); $("#ePlan")?.focus(); }
      return;
    }
    case "pickDue": {
      const inp = $("#eDue"); if (!inp) return;
      try { inp.showPicker(); } catch(x) { ui.dueEdit = true; render(); $("#eDue")?.focus(); }
      return;
    }
    case "clearDue": e.stopPropagation(); t.due = null; ui.dueEdit = false; break;
    case "stepToggle": if (step) step.done = !step.done; break;
    case "stepDel": t.steps = t.steps.filter(s => s !== step); break;
    case "delete":
      if (ui.delArm !== t.id) { ui.delArm = t.id; return render(); }
      if (t.gcal) calRemoveQuiet(t.gcal);
      S.tasks = S.tasks.filter(x => x !== t); ui.sel = null; ui.delArm = null; break;
    case "calSettings": return openSettings();
    case "calOpen": calDraft = {taskId:t.id, allDay: !G.defaultTime, time: G.defaultTime || "09:00", duration: G.defaultDuration || 30, err:""}; ui.calMenu = null; return render();
    case "calCancel": calDraft = null; return render();
    case "calAllDay": calDraft.allDay = true; return render();
    case "calTimed": calDraft.allDay = false; return render();
    case "calAdd": return calAdd(t);
    case "calMenu": ui.calMenu = ui.calMenu === t.id ? null : t.id; return render();
    case "calView": if (t.gcal?.htmlLink) window.tally.openExternal(t.gcal.htmlLink); return;
    case "calRemove": ui.calMenu = null; return calRemove(t);
    case "calEdit": calDraft = {taskId:t.id, allDay: !t.gcal.time, time: t.gcal.time || G.defaultTime || "09:00", duration: t.gcal.duration || G.defaultDuration || 30, err:"", editing:true}; ui.calMenu = null; return render();
  }
  commit();
  if (act === "pickDue") autoCal();
}

main.addEventListener("input", e => {

  const t = taskById(ui.sel); if (!t) return;
  if (id === "eTitle") { autosize(e.target); t.title = e.target.value.replace(/\n/g, " "); persist(); }

});

});
main.addEventListener("focusout", e => {

  if (e.target.id?.startsWith("step-")) { const s = t.steps.find(s => "step-" + s.id === e.target.id); if (s && !s.title.trim()) { t.steps = t.steps.filter(x => x !== s); commit(); } }
});

/* drag: onto a calendar day to reschedule, onto a list to move */
let dragId = null, dragKind = "due", dragGrp = null;
function reorder(grpEl, id, targetId, after){
  const ids = [...grpEl.querySelectorAll(":scope > .row")].map(r => r.dataset.id).filter(x => x !== id);
  let i = ids.indexOf(targetId); if (i < 0) return;
  if (after) i++;
  ids.splice(i, 0, id);
  ids.forEach((x, k) => { const t = taskById(x); if (t) t.order = (k + 1) * 10; });
  commit();
}
function planFor(id, day){
  const t = taskById(id); if (!t) return;
  t.plan = day; commit();
  toast(`Planned “${t.title}” for ${lc(dueLabel(day).text)}` + (t.due && day > t.due ? `. Heads up: it's due ${lc(dueLabel(t.due).text)}.` : ""));
}
const clearDrop = () => document.querySelectorAll(".drop,.drop-before,.drop-after").forEach(x => x.classList.remove("drop", "drop-before", "drop-after"));
document.addEventListener("dragstart", e => {
  const el = e.target.closest?.(".ev,.pick,.row[draggable=true]"); if (!el) return;
  dragId = el.dataset.id; e.dataTransfer.effectAllowed = "move";
  dragKind = el.dataset.kind || (($("#calMode").hidden ? "due" : calKind()));
  dragGrp = el.parentElement?.classList.contains("grp") ? el.parentElement : null;
  try { e.dataTransfer.setData("text/plain", taskById(dragId)?.title || ""); } catch(x){}
  el.classList.add("dragging");
});
document.addEventListener("dragend", e => { dragId = null; dragGrp = null; clearDrop(); document.querySelectorAll(".dragging").forEach(x => x.classList.remove("dragging")); });
document.addEventListener("dragover", e => {
  if (!dragId) return;
  const row = dragGrp && e.target.closest?.(".row");
  if (row && row.parentElement === dragGrp) {           // reorder inside the same group
    clearDrop(); e.preventDefault(); e.dataTransfer.dropEffect = "move";
    if (row.dataset.id === dragId) return;
    const r = row.getBoundingClientRect();
    row.classList.add(e.clientY > r.top + r.height / 2 ? "drop-after" : "drop-before");
    return;
  }
  const tgt = e.target.closest?.(".cell,.day-drop,[data-list]"); clearDrop();
  if (!tgt) return;
  e.preventDefault(); e.dataTransfer.dropEffect = "move"; tgt.classList.add("drop");
});
document.addEventListener("drop", e => {
  if (!dragId) return;
  const row = dragGrp && e.target.closest?.(".row");
  if (row && row.parentElement === dragGrp) {
    e.preventDefault();
    const after = row.classList.contains("drop-after"), id = dragId, g = dragGrp;
    dragId = null; dragGrp = null; clearDrop();
    if (row.dataset.id !== id) reorder(g, id, row.dataset.id, after);
    return;
  }
  const t = taskById(dragId), tgt = e.target.closest?.(".cell,.day-drop,[data-list]");
  dragId = null; clearDrop();
  if (!t || !tgt) return;
  e.preventDefault();
  if (tgt.classList.contains("cell") || tgt.classList.contains("day-drop")) {
    const ds = tgt.dataset.date;
    if (dragKind === "plan" || tgt.classList.contains("day-drop")) {
      if (t.plan === ds) return;
      ui.calDay = ds; planFor(t.id, ds);
    } else {
      if (t.due === ds) return;
      t.due = ds; ui.calDay = ds; commit(); toast(`Due date moved to ${dueLabel(ds).text}`);
    }
  } else {
    const l = listById(tgt.dataset.list); if (!l || t.listId === l.id) return;
    t.listId = l.id; commit(); toast(`Moved to ${l.name}`);
  }
});

/* =================== Google Calendar (Mac app only) =================== */
let G = {configured:false, connected:false};
let calDraft = null;
const calBusy = new Set();
let calCalendars = null;

async function refreshG(){
  if (!isDesktop) return;
  try { G = await window.tally.gcal.status(); } catch(e){ G = {configured:false, connected:false}; }
  const el = $("#gstat");
  el.classList.toggle("ok", !!G.connected);

const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;

}

/* ---------- tiny markdown for assistant replies and notes ---------- */
function md(text){
  const inline = s => esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g, "$1<i>$2</i>")
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/(https?:\/\/[^\s<]+)/g, '<a class="link" href="$1" target="_blank" rel="noopener">$1</a>');
  const out = []; let list = null;
  for (const raw of String(text || "").split("\n")) {
    const line = raw.trimEnd();
    const b = line.match(/^\s*[-*•]\s+(.*)$/), n = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (b || n) {
      const tag = b ? "ul" : "ol";
      if (!list || list.tag !== tag) { if (list) out.push(`</${list.tag}>`); list = {tag}; out.push(`<${tag}>`); }
      out.push(`<li>${inline((b || n)[1])}</li>`); continue;
    }
    if (list) { out.push(`</${list.tag}>`); list = null; }
    const h = line.match(/^#{1,4}\s+(.*)$/);
    if (h) out.push(`<p class="md-h">${inline(h[1])}</p>`);
    else if (line.trim()) out.push(`<p>${inline(line)}</p>`);
  }
  if (list) out.push(`</${list.tag}>`);
  return out.join("");
}

/* ================= Google Calendar (works in the browser on every device) ================= */
const Cal = (() => {
  const SCOPES = "https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/calendar.calendarlist.readonly";
  let token = null, exp = 0, gis = null, calCache = null;
  try { const t = JSON.parse(sessionStorage.getItem("orbit-gtok") || "null"); if (t && t.exp > Date.now() + 60000) { token = t.token; exp = t.exp; } } catch(e){}
  const flag = (k, v) => { try { if (v === undefined) return localStorage.getItem(k) === "1"; localStorage.setItem(k, v ? "1" : "0"); } catch(e){ return false; } };
  const clientId = () => (prefs().gClientId || "").trim();
  const live = () => !!token && Date.now() < exp - 30000;
  function loadGis(){
    if (window.google?.accounts?.oauth2) return Promise.resolve();
    if (gis) return gis;
    gis = new Promise((res, rej) => {
      const s = document.createElement("script"); s.src = "https://accounts.google.com/gsi/client"; s.async = true;
      s.onload = () => res(); s.onerror = () => { gis = null; rej(new Error("Couldn't load Google sign-in. Check your internet connection.")); };
      document.head.appendChild(s);
    });
    return gis;
  }
  async function connect(){             // call from a tap or click
    if (!clientId()) throw new Error("Add your Google client ID in Settings › Google Calendar first.");
    if (window.tally) {                 // Mac app: Google blocks sign-in inside app windows, so use the real browser
      if (!window.tally.googleSignIn) throw new Error("Update the Orbit Mac app to connect Google Calendar here (or use the website in Safari or Chrome).");
      toast("Finish signing in to Google in your browser");
      const r = await window.tally.googleSignIn({clientId: clientId(), scopes: SCOPES, consent: !flag("orbit-gcal-linked")});
      token = r.access_token; exp = Date.now() + (Number(r.expires_in) || 3600) * 1000;
      try { sessionStorage.setItem("orbit-gtok", JSON.stringify({token, exp})); } catch(e){}
      flag("orbit-gcal-linked", true); calCache = null; return;
    }
    if (!window.google?.accounts?.oauth2) { await loadGis(); throw new Error("Google sign-in is ready. Tap Connect once more."); }
    await new Promise((res, rej) => {
      const client = google.accounts.oauth2.initTokenClient({
        client_id: clientId(), scope: SCOPES,
        callback: r => {
          if (r.error) return rej(new Error(r.error === "access_denied" ? "Calendar access wasn't allowed." : (r.error_description || r.error)));
          if (!google.accounts.oauth2.hasGrantedAllScopes(r, ...SCOPES.split(" "))) return rej(new Error("Orbit needs both calendar boxes checked. Try connecting again."));
          token = r.access_token; exp = Date.now() + (Number(r.expires_in) || 3600) * 1000;
          try { sessionStorage.setItem("orbit-gtok", JSON.stringify({token, exp})); } catch(e){}
          flag("orbit-gcal-linked", true); res();
        },
        error_callback: err => rej(new Error(err?.type === "popup_closed" ? "Google sign-in was closed before it finished." : err?.type === "popup_failed_to_open" ? "Your browser blocked the Google sign-in window. Allow pop-ups for this site and try again." : "Google sign-in didn't finish.")),
      });
      client.requestAccessToken({prompt: flag("orbit-gcal-linked") ? "" : "consent"});
    });
    calCache = null;
  }
  function disconnect(){
    if (token && window.google?.accounts?.oauth2) google.accounts.oauth2.revoke(token, () => {});
    token = null; exp = 0; flag("orbit-gcal-linked", false);
    try { sessionStorage.removeItem("orbit-gtok"); } catch(e){}
  }
  async function api(path, opts = {}){
    if (!live()) { const e = new Error("Google Calendar needs to be reconnected (tap Reconnect)."); e.code = "auth"; throw e; }
    const r = await fetch("https://www.googleapis.com/calendar/v3" + path, {...opts, headers: {Authorization: "Bearer " + token, ...(opts.body ? {"Content-Type": "application/json"} : {})}});
    if (r.status === 401) { token = null; const e = new Error("Google Calendar needs to be reconnected (tap Reconnect)."); e.code = "auth"; throw e; }
    if (r.status === 204) return null;
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error?.message || `Google Calendar error ${r.status}`);
    return j;
  }
  async function calendars(){
    if (calCache && calCache.t > Date.now() - 10 * 60000) return calCache.list;
    const j = await api("/users/me/calendarList?maxResults=100");
    const list = (j.items || []).filter(c => !c.hidden && c.selected !== false && !/#holiday@|#contacts@/.test(c.id))
      .map(c => ({id: c.primary ? "primary" : c.id, name: c.summaryOverride || c.summary, primary: !!c.primary, color: c.backgroundColor, canEdit: /owner|writer/.test(c.accessRole)}));
    calCache = {t: Date.now(), list}; return list;
  }
  const norm = (e, c) => ({id: e.id, calendarId: c.id, calendar: c.name, color: c.color || "#6366f1", title: e.summary || "(no title)",
    allDay: !!e.start?.date, start: e.start?.dateTime || e.start?.date, end: e.end?.dateTime || e.end?.date, location: e.location || "", description: (e.description || "").slice(0, 300), link: e.htmlLink});
  async function list(fromISO, toISO){      // [from, to) as YYYY-MM-DD
    const cals = await calendars();
    const tmin = parseISO(fromISO).toISOString(), tmax = parseISO(toISO).toISOString();
    const out = [];
    await Promise.all(cals.map(async c => {
      const j = await api(`/calendars/${encodeURIComponent(c.id)}/events?singleEvents=true&orderBy=startTime&maxResults=250&timeMin=${encodeURIComponent(tmin)}&timeMax=${encodeURIComponent(tmax)}`);
      for (const e of j.items || []) if (e.status !== "cancelled") out.push(norm(e, c));
    }));
    return out.sort((a, b) => (a.allDay === b.allDay ? 0 : a.allDay ? -1 : 1) || String(a.start).localeCompare(String(b.start)));
  }
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  function toGoogle(ev){
    const o = {};
    if (ev.title != null) o.summary = ev.title;
    if (ev.location != null) o.location = ev.location;
    if (ev.description != null) o.description = ev.description;
    if (ev.start) {
      if (ev.all_day || /^\d{4}-\d{2}-\d{2}$/.test(ev.start)) {
        const s = ev.start.slice(0, 10), e = (ev.end || "").slice(0, 10);
        const next = d => { const x = parseISO(d); x.setDate(x.getDate() + 1); return iso(x); };
        o.start = {date: s}; o.end = {date: e && e > s ? e : next(s)};
      } else {
        const fix = t => t.length === 16 ? t + ":00" : t.slice(0, 19);
        const st = fix(ev.start);
        let en = ev.end ? fix(ev.end) : null;
        if (!en) { const d = new Date(st); d.setMinutes(d.getMinutes() + 60); en = `${iso(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}:00`; }
        o.start = {dateTime: st, timeZone: tz}; o.end = {dateTime: en, timeZone: tz};
      }
    }
    return o;
  }
  async function resolveCal(name){
    if (!name) return "primary";
    const cals = await calendars();
    const c = cals.find(c => c.id === name) || cals.find(c => c.name.toLowerCase() === String(name).toLowerCase()) || cals.find(c => c.name.toLowerCase().includes(String(name).toLowerCase()));
    return c && c.canEdit ? c.id : "primary";
  }
  async function create(ev){ const calId = await resolveCal(ev.calendar); const cals = await calendars(); const r = await api(`/calendars/${encodeURIComponent(calId)}/events`, {method: "POST", body: JSON.stringify(toGoogle(ev))}); return norm(r, cals.find(c => c.id === calId) || {id: calId, name: "Calendar"}); }
  async function update(calId, id, ev){ const r = await api(`/calendars/${encodeURIComponent(calId)}/events/${encodeURIComponent(id)}`, {method: "PATCH", body: JSON.stringify(toGoogle(ev))}); return norm(r, {id: calId, name: ""}); }
  async function remove(calId, id){ await api(`/calendars/${encodeURIComponent(calId)}/events/${encodeURIComponent(id)}`, {method: "DELETE"}); }
  return {live, linked: () => flag("orbit-gcal-linked"), hasClient: () => !!clientId(), preload: () => { if (clientId()) loadGis().catch(() => {}); }, connect, disconnect, calendars, list, create, update, remove};
})();

/* day-by-day event cache for Today and the Planner */
const evCache = {}, evBusy = {};
function dayEvents(ds){
  const c = evCache[ds];

async function pickModel(key, avoid = []){

async function gemini({contents, system, tools, maxTokens}){
  const key = (prefs().geminiKey || "").trim();
  if (!key) throw new Error("Add your free Gemini key in Settings › Assistant first.");
  const avoid = [];
  for (let attempt = 0; attempt < 3; attempt++) {
    const model = await pickModel(key, avoid);
    const body = {contents, systemInstruction: {parts: [{text: system}]}, generationConfig: {temperature: 0.5, ...(maxTokens ? {maxOutputTokens: maxTokens} : {})}};
    if (tools) { body.tools = [{functionDeclarations: TOOLS}]; body.toolConfig = {functionCallingConfig: {mode: "AUTO"}}; }
    let r;
    try { r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)}); }
    catch(e) { throw new Error("Couldn't reach Gemini. Check your internet connection."); }
    const j = await r.json().catch(() => ({}));
    const msg = j.error?.message || "";
    if (r.status === 404 || (r.status === 429 && /limit:\s*0\b/.test(msg)) || (r.status === 400 && /not (found|supported)/i.test(msg))) { avoid.push(model); try { localStorage.removeItem("orbit-model"); } catch(e){} continue; }
    if (r.status === 429) throw new Error("You've hit Gemini's free limit for now. Wait a minute and try again.");
    if (r.status === 400 && /API key/i.test(msg)) throw new Error("Gemini didn't accept your key. Check it in Settings › Assistant.");
    if (r.status === 403) throw new Error("Gemini refused the request. Make sure your key is from aistudio.google.com and the Generative Language API is allowed.");
    if (!r.ok) throw new Error(msg || `Gemini error ${r.status}`);
    const cand = j.candidates?.[0];
    if (!cand) throw new Error(j.promptFeedback?.blockReason ? "Gemini declined to answer that one." : "Gemini sent an empty reply. Try again.");
    cand.content ||= {role: "model", parts: []};
    cand.content.parts ||= [];

  if (!aiReady()) { toast("Add your free Gemini key in Settings › Assistant first."); openSettings(); return; }
  const turn = {type: "ai", text: "", acts: [], props: [], snap: snapshot(), at: Date.now()};
  AI.items.push({type: "user", text, at: Date.now()}, turn);
  AI.history.push({role: "user", parts: [{text}]});
  AI.busy = true; renderAI(true);
  try {
    for (let round = 0; round < 8; round++) {
      const content = await gemini({contents: trimHistory(AI.history, 40), system: systemPrompt(), tools: true});
      AI.history.push(content);
      const t = textOf(content);
      if (t) turn.text += (turn.text ? "\n\n" : "") + t;
      const calls = content.parts.filter(p => p.functionCall);
      if (!calls.length) break;
      const responses = [];
      for (const p of calls) responses.push({functionResponse: {name: p.functionCall.name, response: await runTool(p.functionCall.name, p.functionCall.args || {}, turn)}});
      AI.history.push({role: "user", parts: responses});
      renderAI(true);
      if (round === 7) turn.text += (turn.text ? "\n\n" : "") + "I stopped there. Ask me to keep going if there's more.";
    }
    if (!turn.text && !turn.acts.length && !turn.props.length) turn.text = "Done.";
  } catch(e) {
    turn.error = e.message;
    // drop the unanswered turn from what Gemini sees next time
    while (AI.history.length && !(AI.history[AI.history.length - 1].role === "user" && AI.history[AI.history.length - 1].parts?.some(p => p.text))) AI.history.pop();
    AI.history.pop();
  }
  if (!turn.acts.length) delete turn.snap;
  AI.busy = false; saveChat(); renderAI(true);
}
function undoTurn(i){
  const t = AI.items[i]; if (!t?.snap) return;
  const s = JSON.parse(t.snap);
  S.lists = s.lists; S.tasks = s.tasks; S.notes = s.notes; prefs().memory = s.memory;
  ensureShape(); t.undone = true; delete t.snap; commit(); saveChat(); renderAI(); toast("Undone");
}
const AI_CHIPS = [
  ["Plan my day", "Plan my day. Look at my calendar and what's due soon, then set do dates for today and tell me what to do in order."],
  ["Plan my week", "Plan my week: check my calendar, spread my tasks across the next 7 days before their due dates, and set do dates."],
  ["What's due soon?", "What's due in the next 7 days? Group it by day and flag anything I should start now."],
  ["Weekly review", "Do a weekly review with me: what I finished this week, what's overdue or slipping, and what's coming up next week. Suggest what to plan."],
  ["Break down a task", "Pick my biggest upcoming assignment and break it into steps, with do dates before it's due."],
  ["Remember something", "Remember that "],
];

    const name = (prefs().memory || []).map(m => m.match(/(?:name is|called|i'm|i am)\s+([A-Z][a-z]+)/i)?.[1]).find(Boolean);
    log.innerHTML = `<div class="ai-hello"><div class="ai-orb">${icon("i-spark")}</div><h3>${hi}${name ? `, ${esc(name)}` : ""}</h3>
      <p>Tell me what's due, ask what to do next, or have me plan your week. I can see your tasks, notes and calendar.</p></div>`;
  } else {
    log.innerHTML = AI.items.map((it, i) => {
      if (it.type === "user") return `<div class="msg-u"><div>${esc(it.text).replace(/\n/g, "<br>")}</div></div>`;
      const pending = AI.busy && i === AI.items.length - 1;
      return `<div class="msg-a">
        ${it.acts?.length ? `<div class="acts ${it.undone ? "undone" : ""}">${it.acts.map(a => `<div class="act">${icon(a.icon || "i-check")}<span>${esc(a.text)}</span></div>`).join("")}
          ${it.snap && !pending ? `<button class="undo" data-undo="${i}">Undo</button>` : it.undone ? `<span class="undone-l">Undone</span>` : ""}</div>` : ""}
        ${it.props?.length ? it.props.map(p => `<div class="prop ${p.status}">${icon(p.kind === "delete" ? "i-trash" : "i-gcal")}<div class="pt">${propText(p)}${p.error ? `<em>${esc(p.error)}</em>` : ""}</div>
          ${p.status === "pending" ? `<button class="btn" data-prop="${i}:${p.id}">${p.kind === "add" ? "Add" : p.kind === "update" ? "Change" : "Delete"}</button><button class="btn ghost" data-propskip="${i}:${p.id}">Skip</button>`
            : p.status === "done" ? `<span class="ok">${p.kind === "add" ? "Added" : p.kind === "update" ? "Changed" : "Deleted"} ✓</span>` : p.status === "skipped" ? `<span class="fine">Skipped</span>` : `<button class="btn ghost" data-prop="${i}:${p.id}">Try again</button>`}</div>`).join("") : ""}
        ${it.text ? `<div class="md">${md(it.text)}</div>` : ""}
        ${it.error ? `<div class="ai-err">${esc(it.error)}</div>` : ""}
        ${pending ? `<div class="typing"><i></i><i></i><i></i></div>` : ""}

}

/* ================= Daily brief on Today ================= */
let briefBusy = false;
function getBrief(){ try { const b = JSON.parse(localStorage.getItem("orbit-brief") || "null"); return b && b.date === today() ? b : null; } catch(e){ return null; } }
async function makeBrief(force){
  if (briefBusy || !aiReady()) return;
  if (!force && getBrief()) return;
  briefBusy = true; scheduleRender();
  const t0 = today(), soon = addDays(3);
  const pick = f => S.tasks.filter(t => !t.done && f(t)).map(t => `${t.title}${t.due ? ` (due ${t.due})` : ""}${t.plan ? ` (do ${t.plan})` : ""}${t.important ? " ★" : ""}`);
  let events = [];
  if (Cal.live()) { try { events = await Cal.list(t0, addDays(1)); } catch(e){} }
  const prompt = `Write my daily brief for ${new Date().toLocaleDateString("en-US", {weekday: "long", month: "long", day: "numeric"})}.
Calendar today: ${events.map(e => `${e.allDay ? "all day" : fmtClock(e.start)} ${e.title}`).join("; ") || "nothing / not connected"}
Overdue: ${pick(t => t.due && t.due < t0).join("; ") || "none"}
Planned for today: ${pick(t => t.plan === t0 || (t.plan && t.plan < t0)).join("; ") || "none"}
Due today: ${pick(t => t.due === t0).join("; ") || "none"}
Due in the next 3 days: ${pick(t => t.due > t0 && t.due <= soon).join("; ") || "none"}
Starred: ${pick(t => t.important).join("; ") || "none"}
Format: one short encouraging opening line, then 3 to 5 bullets: what matters most today in a sensible order (fit around calendar events), and one heads-up about something coming soon. Under 90 words. No headings.`;
  try {
    const c = await gemini({contents: [{role: "user", parts: [{text: prompt}]}], system: "You are Orbit, a warm, concise personal assistant.", maxTokens: 400});
    localStorage.setItem("orbit-brief", JSON.stringify({date: t0, text: textOf(c)}));
  } catch(e) { try { localStorage.setItem("orbit-brief", JSON.stringify({date: t0, text: "", error: e.message})); } catch(x){} }
  briefBusy = false; scheduleRender();
}
function briefHtml(){
  if (!aiReady()) return "";
  let hidden = false; try { hidden = localStorage.getItem("orbit-brief-hide") === today(); } catch(e){}
  if (hidden) return "";
  const b = getBrief();
  if (!b && !briefBusy) setTimeout(() => makeBrief(false), 0);
  return `<div class="brief">
    <div class="brief-h">${icon("i-spark")}<span>Your brief</span><span class="sp"></span>
      <button class="ib sm" data-brief="refresh" title="Refresh" aria-label="Refresh brief">${icon("i-refresh")}</button>
      <button class="ib sm" data-brief="hide" title="Hide for today" aria-label="Hide brief">${icon("i-x")}</button></div>
    <div class="brief-b md">${briefBusy || !b ? `<div class="typing"><i></i><i></i><i></i></div>` : b.error ? `<p class="ai-err">${esc(b.error)}</p>` : md(b.text)}</div>
  </div>`;
}
$("#listMode").addEventListener("click", e => {
  const b = e.target.closest("[data-brief]"); if (!b) return;
  if (b.dataset.brief === "refresh") makeBrief(true);
  if (b.dataset.brief === "hide") { try { localStorage.setItem("orbit-brief-hide", today()); } catch(x){} render(); }
});
function todayTop(){ return aiAllowed ? briefHtml() + scheduleHtml(today(), "Schedule") : ""; }


/* settings sheet */
let sheet = null;
$("#settingsBtn").addEventListener("click", () => openSettings());
function openSettings(){ if (!isDesktop && !isCloud) return; if (Cal.hasClient()) Cal.preload(); sheet = {msg:"", msgType:""}; renderSheet(); if (isDesktop && G.connected && !calCalendars) loadCalendars(); }
function closeSettings(){ if (sheet?.connecting) window.tally.gcal.cancelConnect(); sheet = null; renderSheet(); }
async function loadCalendars(){
  try { calCalendars = await window.tally.gcal.calendars(); } catch(e) { calCalendars = []; if (sheet) { sheet.msg = e.message; sheet.msgType = "err"; } }
  renderSheet();
}
function renderSheet(){
  // removing a focused, edited box fires "change" again; don't redraw inside a redraw
  if (renderSheet.busy) return setTimeout(renderSheet, 0);
  renderSheet.busy = true;
  try { renderSheetNow(); } finally { renderSheet.busy = false; }
}
function renderSheetNow(){
  const slot = $("#sheetSlot");
  if (!sheet) { slot.innerHTML = ""; return; }
  const f = captureFocus();
  const msg = sheet.msg ? `<div class="msg ${sheet.msgType}">${esc(sheet.msg)}</div>` : "";
  const p = prefs();
  const aiSec = aiAllowed ? `<section><h3>${icon("i-spark")}Assistant</h3>
      <p>Orbit's assistant runs on Google Gemini's free tier. Get a key at <a class="link" href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>. It syncs privately to your account.</p>
      <label class="field">Gemini API key<input id="setGemini" type="password" placeholder="${p.geminiKey ? "Saved. Paste a new one to replace it." : "Paste your key"}" autocomplete="off" spellcheck="false"></label>
      <label class="toggle"><input type="checkbox" id="setCalConfirm" ${p.calConfirm === false ? "" : "checked"}> Ask me before the assistant changes my Google Calendar</label>
      ${(p.memory || []).length ? `<label class="field" style="margin-top:12px">What Orbit remembers about you</label><div class="mem">${p.memory.map((m, i) => `<div class="mem-row"><span>${esc(m)}</span><button class="ib sm" data-forget="${i}" aria-label="Forget this">${icon("i-x")}</button></div>`).join("")}</div>` : `<p class="fine">Tell the assistant things to remember, like your classes or a birthday. They'll show up here.</p>`}
      ${p.geminiKey ? `<div class="row-btns" style="margin-top:8px"><button class="btn warn" id="clearGemini">Remove key</button></div>` : ""}
    </section>` : "";
  const webCal = aiAllowed ? `<p>Connect your Google Calendar so Orbit shows your classes and appointments, and the assistant can add or change events. It works on every device.</p>${isDesktop ? `<p class="fine">On the Mac, Google sign-in opens in your web browser. Your Google client needs <b>http://localhost:53682/</b> under Authorized redirect URIs.</p>` : ""}
      <label class="field">Google client ID<input id="setGClient" value="${esc(p.gClientId || "")}" placeholder="1234-abc.apps.googleusercontent.com" autocomplete="off" spellcheck="false"></label>
      <div class="row-btns">${Cal.live() ? `<span class="pill">Connected</span><button class="btn ghost" id="gwDisconnect">Disconnect</button>` : `<button class="btn" id="gwConnect" ${p.gClientId ? "" : "disabled"}>${Cal.linked() ? "Reconnect" : "Connect Google Calendar"}</button>`}</div>
      <p class="fine" style="margin-top:8px">Google signs you out of the calendar about once an hour for security. Orbit shows a Reconnect button when that happens.</p>` : "";
  let g;
  if (!isDesktop) {
    g = webCal;
  } else if (G.connected) {
    const cals = calCalendars || [], durs = [15,30,45,60,90,120];
    const hours = ["07:00","08:00","09:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00","19:00","20:00"];
    g = `<p><span class="pill">Connected${G.email ? " as " + esc(G.email) : ""}</span></p>
      <label class="field">Add events to
        <select id="setCal">${cals.length ? cals.map(c => `<option value="${esc(c.id)}" ${c.id===G.calendarId?"selected":""}>${esc(c.name)}${c.primary?" (main)":""}</option>`).join("") : `<option>${calCalendars ? "No calendars you can edit" : "Loading calendars…"}</option>`}</select></label>
      <label class="field">New events are
        <select id="setTime"><option value="" ${!G.defaultTime?"selected":""}>All day on the due date</option>${hours.map(h => `<option value="${h}" ${G.defaultTime===h?"selected":""}>A time block at ${fmtTime(h)}</option>`).join("")}</select></label>
      ${G.defaultTime ? `<label class="field">Time block length<select id="setDur">${durs.map(m => `<option value="${m}" ${m==G.defaultDuration?"selected":""}>${durLabel(m)}</option>`).join("")}</select></label>` : ""}
      <label class="toggle"><input type="checkbox" id="setAuto" ${G.autoAdd?"checked":""}> Add tasks to the calendar automatically when they get a due date</label>
      ${msg}
      <div class="row-btns" style="margin-top:8px"><button class="btn ghost" id="gDisconnect">Disconnect</button></div>`;
  } else {
    g = `<p>Orbit adds tasks to your Google Calendar with a sign-in key you create once in Google Cloud. It's free and takes about 10 minutes.</p>
      <ol>
        <li>Go to <a class="link" href="#" data-ext="https://console.cloud.google.com/projectcreate">console.cloud.google.com</a> and create a project named <b>Orbit</b>.</li>
        <li>Open <a class="link" href="#" data-ext="https://console.cloud.google.com/apis/library/calendar-json.googleapis.com">Google Calendar API</a> and click <b>Enable</b>.</li>
        <li>Open <a class="link" href="#" data-ext="https://console.cloud.google.com/auth/branding">Google Auth Platform</a>, click <b>Get started</b>, name the app Orbit, choose <b>External</b>, and finish.</li>
        <li>Under <b>Audience</b>, add your Gmail address as a <b>Test user</b>.</li>
        <li>Under <b>Clients</b>, click <b>Create client</b>, choose <b>Desktop app</b>, and create it.</li>
        <li>Copy the <b>Client ID</b> and <b>Client secret</b> into the boxes below.</li>
      </ol>
      <label class="field">Client ID<input id="gId" value="${esc(G.clientId||"")}" placeholder="1234-abc.apps.googleusercontent.com" spellcheck="false" autocomplete="off"></label>
      <label class="field">Client secret<input id="gSecret" type="password" placeholder="${G.configured ? "Saved. Paste a new one to replace it." : "GOCSPX-…"}" spellcheck="false" autocomplete="off"></label>
      ${msg}
      <div class="row-btns" style="margin-top:6px">
        <button class="btn" id="gConnect" ${sheet.connecting?"disabled":""}>${sheet.connecting ? "Waiting for Google…" : "Connect Google Calendar"}</button>
        ${sheet.connecting ? `<button class="btn ghost" id="gCancel">Cancel</button>` : ""}
        ${G.configured && !sheet.connecting ? `<button class="btn warn" id="gForget">Clear saved key</button>` : ""}
      </div>
      ${sheet.connecting ? `<p style="margin-top:10px">Finish signing in on the Google page in your browser. If Google says the app isn't verified, click <b>Continue</b>. It's your own app.</p>` : ""}`;
  }
  slot.innerHTML = `<div class="sheet-bg" id="sheetBg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <header><h2 id="sheetTitle">Settings</h2><button class="ib" id="sheetClose" aria-label="Close settings">${icon("i-x")}</button></header>
    ${isCloud && cloudUser ? `<section><h3>Account</h3><p>Signed in as <b>${esc(cloudUser.email)}</b>. Use the same email and password on your other devices to see the same tasks.</p><div class="row-btns"><button class="btn ghost" id="acctOut">Sign out</button></div></section>` : ""}
    ${aiSec}
    <section><h3>${icon("i-gcal")}Google Calendar</h3>${isDesktop && aiAllowed ? webCal + `<h3 style="margin-top:18px;font-size:14px">Linked task events (Mac app)</h3>` : ""}${g}</section>
    <section><h3>Your data</h3>${isCloud
      ? `<p>Your tasks sync through your own Firebase database${TallyCloud.projectId ? ` (<b>${esc(TallyCloud.projectId)}</b>)` : ""}. Only your account can read or change them. Each device also keeps a copy, so Orbit works offline and catches up when you reconnect.</p>${isDesktop && window.tally.site ? `<div class="row-btns"><button class="btn ghost" id="siteChange">Change Orbit web address</button></div>` : ""}`
      : `<p>Tasks are saved on this Mac in Library › Application Support › Tally (Orbit's data folder). Nothing leaves your Mac except the events you add to Google Calendar.</p>`}</section>
  </div></div>`;
  restoreFocus(f);
}
$("#sheetSlot").addEventListener("click", async e => {
  if (e.target.id === "sheetBg" || e.target.closest("#sheetClose")) return closeSettings();
  const ext = e.target.closest("[data-ext]");
  if (ext) { e.preventDefault(); window.tally.openExternal(ext.dataset.ext); return; }
  const id = e.target.closest("button")?.id;
  if (id === "gConnect") {
    try {
      const cid = $("#gId").value.trim(), sec = $("#gSecret").value.trim();
      if (!cid || (!sec && !G.configured)) throw new Error("Paste both the Client ID and the Client secret.");
      G = await window.tally.gcal.saveCredentials({clientId: cid, clientSecret: sec});
      sheet.connecting = true; sheet.msg = ""; renderSheet();
      G = await window.tally.gcal.connect();
      sheet.connecting = false; calCalendars = null;
      await refreshG(); renderSheet(); loadCalendars();
      toast("Google Calendar connected");
    } catch(err) { if (sheet) { sheet.connecting = false; sheet.msg = err.message; sheet.msgType = "err"; renderSheet(); } }
  }
  if (id === "gCancel") window.tally.gcal.cancelConnect();
  if (id === "acctOut") { closeSettings(); TallyCloud.signOut(); return; }
  if (id === "gwConnect") { await connectCalendar(); return; }
  if (id === "gwDisconnect") { Cal.disconnect(); for (const k in evCache) delete evCache[k]; render(); renderSheet(); return; }
  if (id === "clearGemini") { delete prefs().geminiKey; commit(); renderSheet(); return; }
  const fg = e.target.closest("[data-forget]"); if (fg) { prefs().memory.splice(+fg.dataset.forget, 1); commit(); renderSheet(); return; }
  if (id === "siteChange") { window.tally.site.change(); return; }
  if (id === "gForget") { G = await window.tally.gcal.forget(); await refreshG(); renderSheet(); }
  if (id === "gDisconnect") { G = await window.tally.gcal.disconnect(); calCalendars = null; await refreshG(); sheet.msg = "Disconnected. Events already on your calendar stay there."; sheet.msgType = "ok"; renderSheet(); }
});
$("#sheetSlot").addEventListener("change", async e => {
  if (e.target.id === "setGemini") { const k = e.target.value.trim(); if (k) { prefs().geminiKey = k; try { localStorage.removeItem("orbit-model"); } catch(x){} commit(); sheet.msg = ""; toast("Gemini key saved"); renderSheet(); } return; }
  if (e.target.id === "setCalConfirm") { prefs().calConfirm = e.target.checked; commit(); return; }
  if (e.target.id === "setGClient") { prefs().gClientId = e.target.value.trim(); commit(); Cal.preload(); renderSheet(); return; }
  try {
    if (e.target.id === "setCal") { const c = (calCalendars||[]).find(x => x.id === e.target.value); G = await window.tally.gcal.setPrefs({calendarId: e.target.value, calendarName: c?.name}); sheet.msg = "New events will go to " + (c?.name || "that calendar") + "."; sheet.msgType = "ok"; }
    if (e.target.id === "setTime") G = await window.tally.gcal.setPrefs({defaultTime: e.target.value});
    if (e.target.id === "setDur") G = await window.tally.gcal.setPrefs({defaultDuration: e.target.value});
    if (e.target.id === "setAuto") G = await window.tally.gcal.setPrefs({autoAdd: e.target.checked});
  } catch(err) { sheet.msg = err.message; sheet.msgType = "err"; }
  renderSheet(); refreshG();
});

if (isCloud) bootCloud(); else if (isDesktop) bootDesktop(); else bootWeb();
})();
