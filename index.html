<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f3f4fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0d16" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Orbit">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.png">
<title>Orbit</title>
<link rel="stylesheet" href="fonts.css">
<script>window.TALLY_MODE = "cloud";</script>
<script src="firebase-config.js?v=9fb57785b1"></script>
<script src="cloud.js?v=9fb57785b1"></script>
<style>
/* Layout: a quiet text sidebar beside one centered reading column; Calendar swaps the column for a month grid with a day agenda. */
:root{
  --bg:#f3f4fa; --panel:#ffffff; --sunk:#eff0f7; --hover:rgba(40,40,90,.04);
  --fg:#14152b; --muted:#6f7290; --faint:#aeb1c7; --line:#e8e9f3;
  --accent:#6366f1; --accent2:#a855f7; --accent-soft:#eef0ff; --star:#f59e0b; --danger:#ef4444;
  --shadow:0 18px 40px -18px rgba(40,40,110,.28),0 2px 8px -3px rgba(40,40,110,.08);
  --display:var(--body);
  --body:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0d16; --panel:#12131f; --sunk:#1c1d2c; --hover:rgba(255,255,255,.04);
  --fg:#eceefa; --muted:#9093b0; --faint:#555872; --line:#222438;
  --accent:#818cf8; --accent2:#c084fc; --accent-soft:#25264a; --star:#fbbf24; --danger:#f87171;
  --shadow:0 18px 40px -16px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.02); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0d16; --panel:#12131f; --sunk:#1c1d2c; --hover:rgba(255,255,255,.04);
  --fg:#eceefa; --muted:#9093b0; --faint:#555872; --line:#222438;
  --accent:#818cf8; --accent2:#c084fc; --accent-soft:#25264a; --star:#fbbf24; --danger:#f87171;
  --shadow:0 18px 40px -16px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.02); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
.desktop body{-webkit-user-select:none;user-select:none}
.desktop input,.desktop textarea,.desktop .r-title{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.brand,.title,.empty h3,.cal-month,.ag-day,.sheet h2{font-family:var(--display);font-weight:700;letter-spacing:-.025em}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100%}

/* ---------- sidebar ---------- */
.side{display:flex;flex-direction:column;min-height:0;padding:20px 12px 14px}
.mac .side{padding-top:46px}
.side-top{display:flex;align-items:baseline;padding:0 10px 16px;-webkit-app-region:drag}
.brand{font-size:21px;line-height:1}
.brand em{color:var(--accent);font-style:normal}
.search{display:flex;align-items:center;gap:8px;margin:0 0 14px;padding:7px 10px;border-radius:9px;background:var(--sunk);color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--fg);font-size:13.5px}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{display:none}
.nav{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:7px 10px;border-radius:8px;font-size:14px;text-align:left;color:var(--muted)}
.nav-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item:hover{background:var(--hover);color:var(--fg)}
.nav-item.on{background:var(--panel);color:var(--fg);font-weight:600;box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(16,24,40,.05)}
.nav-item .n{font-size:12px;font-weight:500;color:var(--faint);font-variant-numeric:tabular-nums}
.nav-item .n.late{color:var(--danger)}
.nav-item .dot{width:8px;height:8px;border-radius:50%;background:var(--c);margin:0 4px;flex:none}
.nav-item .dot.pick{width:16px;height:16px;margin:0;display:grid;place-items:center;background:none;border-radius:50%}
.nav-item .dot.pick::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);transition:transform .12s}
.nav-item .dot.pick:hover{background:var(--sunk)}
.nav-item .dot.pick:hover::after{transform:scale(1.35)}
.nav-item .ico-c{color:var(--c)}
.cpop{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px;width:212px}
.cpop .swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:6px 6px 8px}
.custom-c{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--muted)}
.custom-c:hover{background:var(--sunk);color:var(--fg)}
.custom-c input{width:22px;height:22px;padding:0;border:0;background:none;cursor:pointer;border-radius:50%}
.custom-c input::-webkit-color-swatch-wrapper{padding:0}
.custom-c input::-webkit-color-swatch{border:0;border-radius:50%}
.custom-c input::-moz-color-swatch{border:0;border-radius:50%}
.nav-item.drop{background:var(--accent-soft);color:var(--accent)}
.nav-label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding:20px 10px 6px}
.newlist{display:flex;align-items:center;gap:11px;padding:7px 10px;color:var(--muted);font-size:14px;border-radius:8px}
.newlist:focus-within{background:var(--hover)}
.newlist input{border:0;background:none;outline:none;flex:1;min-width:0;color:var(--fg)}
.newlist input::placeholder{color:var(--muted)}
.side-foot{display:flex;align-items:center;gap:6px;margin-top:10px;padding:10px 4px 0;border-top:1px solid var(--line)}
.side-foot .tb{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;color:var(--muted);font-size:13px}
.side-foot .tb:hover{background:var(--hover);color:var(--fg)}
.gstat{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--faint);min-width:0;padding-right:6px}
.gstat i{width:6px;height:6px;border-radius:50%;background:var(--faint);flex:none}
.gstat.ok{color:var(--muted)} .gstat.ok i{background:#22a06b}
.gstat span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- main ---------- */
.main{background:var(--panel);min-width:0;min-height:0;display:flex;flex-direction:column;border-left:1px solid var(--line)}
.top{display:flex;align-items:flex-end;gap:16px;padding:44px 48px 22px;width:100%;max-width:816px;margin:0 auto;-webkit-app-region:drag}
.is-cal .top{max-width:none;padding-bottom:14px}
.is-cal .title{font-size:30px}
.top button,.top input,.top .pop{-webkit-app-region:no-drag}
.top .menu-btn{display:none}
.heading{flex:1;min-width:0}
.title{display:block;width:100%;border:0;background:none;outline:none;padding:0;margin:0;font-size:38px;line-height:1.1;color:var(--fg);text-overflow:ellipsis}
.title[readonly]{cursor:default}
.title:not([readonly]):hover{cursor:text}
.sub{margin-top:8px;color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
.sub b{color:var(--danger);font-weight:500}
.tools{display:flex;align-items:center;gap:6px;position:relative;padding-bottom:4px}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--sunk);gap:2px}
.seg button{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(16,24,40,.1),0 0 0 .5px var(--line)}
.ib{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--muted);flex:none}
.ib:hover{background:var(--sunk);color:var(--fg)}
.ib.on{color:var(--star)}
.ib.on svg{fill:currentColor}

.pop{position:absolute;right:0;top:42px;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;width:228px;display:flex;flex-direction:column}
.pop .row-b{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;text-align:left;width:100%;font-size:13.5px}
.pop .row-b:hover{background:var(--sunk)}
.pop .row-b.danger{color:var(--danger)}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.pop-label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding:6px 10px 2px}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:8px 10px}
.sw{width:20px;height:20px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px var(--panel),0 0 0 3px transparent}
.sw.on{box-shadow:0 0 0 2px var(--panel),0 0 0 3.5px var(--c)}

.scroll{flex:1;min-height:0;overflow-y:auto}
.col{max-width:816px;margin:0 auto;padding:0 48px 80px}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px;padding:10px 14px;border-radius:10px;background:var(--sunk);font-size:13px;color:var(--muted)}
.banner button{margin-left:auto;color:var(--fg);font-weight:600}

/* add row */
.adder{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);color:var(--faint)}
.adder:focus-within{color:var(--accent)}
.adder input[type=text]{flex:1;min-width:0;border:0;outline:none;background:none;padding:4px 0;font-size:15px;color:var(--fg)}
.adder input[type=text]::placeholder{color:var(--muted)}
.adder .ib{width:28px;height:28px}
.date-hid{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.date-vis{border:1px solid var(--line);background:var(--sunk);border-radius:7px;padding:3px 6px;font-size:12.5px;outline:none}
.hint{display:flex;align-items:center;gap:6px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:99px;background:var(--sunk);font-size:12.5px;color:var(--muted);white-space:nowrap;position:relative}
button.chip:hover,.chip-sel:hover{color:var(--fg)}
.chip.sm{height:24px;padding:0 9px;font-size:12px}
.chip.on{background:var(--accent-soft);color:var(--accent)}
.chip.late{background:color-mix(in srgb,var(--danger) 13%,transparent);color:var(--danger)}
.chip .x{display:grid;place-items:center;width:16px;height:16px;margin-right:-5px;border-radius:50%;opacity:.7;cursor:pointer}
.chip .x:hover{opacity:1;background:color-mix(in srgb,currentColor 15%,transparent)}
.chip svg.i{width:14px;height:14px}
.chip-sel select{appearance:none;-webkit-appearance:none;border:0;background:none;outline:none;color:inherit;font-size:12.5px;cursor:pointer;padding:0;max-width:150px}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--c)}

/* task rows */
.group{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding:26px 4px 6px}
.day-drop{display:flex;align-items:baseline;gap:8px;border-radius:8px;transition:background .12s}
.day-drop .dd-rel{text-transform:none;letter-spacing:0;font-size:12px;color:var(--faint)}
.day-drop.today-h{color:var(--accent)}
.day-drop.drop{background:var(--accent-soft);color:var(--accent)}
.day-empty{padding:10px 6px 12px;font-size:13px;color:var(--faint);border-bottom:1px solid var(--line)}
.group.late{color:var(--danger)}
.group.starred{color:var(--star);display:flex;align-items:center;gap:6px}
.group.starred svg.i{width:12px;height:12px;fill:currentColor}
.row{position:relative;display:flex;gap:14px;align-items:flex-start;padding:12px 6px;border-bottom:1px solid var(--line);border-radius:0;outline-offset:-2px}
.row:hover{background:var(--hover)}
.row[draggable=true]{cursor:default}
.row.dragging{opacity:.4}
.row.drop-before{box-shadow:inset 0 2px 0 var(--accent)}
.row.drop-after{box-shadow:inset 0 -2px 0 var(--accent)}
.check{margin-top:2px;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;color:transparent;flex:none;transition:background .15s,border-color .15s}
.check:hover{border-color:var(--c,var(--fg));color:var(--c,var(--fg))}
.check svg{width:11px;height:11px;stroke-width:3}
.done>.check,.done>.e-head>.check{background:var(--c,var(--fg));border-color:var(--c,var(--fg));color:var(--panel)}
.r-body{flex:1;min-width:0}
.r-title{overflow-wrap:anywhere}
.done .r-title{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.meta{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:3px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.meta span{display:inline-flex;align-items:center;gap:5px}
.meta svg.i{width:13px;height:13px}
.meta .late{color:var(--danger)}
.meta .soon{color:var(--accent)}
.meta .dot{width:6px;height:6px;border-radius:50%;background:var(--c)}
.star{color:var(--faint);opacity:0;padding:2px;margin-top:1px;border-radius:6px}
.row:hover .star,.row:focus-within .star,.star.on{opacity:1}
.star:hover{color:var(--fg)}
.star.on{color:var(--star)}
.star.on svg{fill:currentColor}
.done-toggle{display:flex;align-items:center;gap:8px;margin-top:22px;padding:6px 4px;font-size:13px;color:var(--muted)}
.done-toggle:hover{color:var(--fg)}
.done-toggle svg{transition:transform .15s}
.done-toggle.closed svg{transform:rotate(-90deg)}

/* expanded task */
.row.open{flex-direction:column;align-items:stretch;gap:12px;margin:10px -18px;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--shadow)}
.row.open:hover{background:var(--panel)}
.e-head{display:flex;gap:14px;align-items:flex-start}
.e-title{flex:1;min-width:0;border:0;outline:none;background:none;resize:none;font-size:17px;font-weight:600;line-height:1.35;padding:0;overflow:hidden;letter-spacing:-.005em}
.e-notes{display:block;width:100%;border:0;outline:none;background:none;resize:none;font-size:14px;line-height:1.55;color:var(--fg);padding:0 0 0 32px;min-height:22px;overflow:hidden}
.e-notes::placeholder,.e-title::placeholder{color:var(--faint)}
.steps{display:flex;flex-direction:column;padding-left:32px}
.step{display:flex;align-items:center;gap:10px;padding:4px 0}
.step .check{width:15px;height:15px;margin:0;border-width:1.5px}
.step .check svg{width:9px;height:9px}
.step.done .check{background:var(--c);border-color:var(--c);color:var(--panel)}
.step input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:14px;padding:0}
.step.done input{color:var(--muted);text-decoration:line-through}
.step .sx{opacity:0;color:var(--faint);padding:2px}
.step:hover .sx,.step .sx:focus-visible{opacity:1}
.add-step{display:flex;align-items:center;gap:10px;padding:4px 0;color:var(--faint)}
.add-step input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:14px;padding:0}
.add-step input::placeholder{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-left:32px}
.calpanel{margin-left:32px;padding:12px;border-radius:12px;background:var(--sunk);display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px}
.calpanel .seg{background:var(--panel)}
.calpanel .seg button.on{background:var(--sunk)}
.calpanel input,.calpanel select{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 8px;outline:none;font-size:13px}
.calpanel .err,.cal-err{flex-basis:100%;color:var(--danger);font-size:12.5px}
.cal-err{padding-left:32px}
.calpanel .note{flex-basis:100%;color:var(--muted)}
.btn{background:var(--fg);color:var(--panel);border-radius:8px;padding:7px 14px;font-weight:600;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--panel);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.btn.warn{background:none;color:var(--danger)}
.e-foot{display:flex;align-items:center;gap:8px;padding-left:32px;font-size:12px;color:var(--faint)}
.e-foot .sp{flex:1}
.del{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:7px;color:var(--faint);font-size:12.5px}
.del:hover{color:var(--danger)}
.del.arm{background:var(--danger);color:var(--panel)}

.empty{padding:72px 16px;text-align:center;color:var(--muted)}
.empty h3{font-size:22px;color:var(--fg);margin:0 0 8px}
.empty p{margin:0;font-size:14px}

/* ---------- calendar ---------- */
.calmode{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 48px 28px}
.cal-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:6px 0 14px}
.cal-month{font-size:22px;line-height:1;margin:0}
.cal-month span{color:var(--faint);font-weight:500}
.cal-sum{font-size:13px;color:var(--muted)}
.cal-sum b{color:var(--danger);font-weight:500}
.cal-bar .sp{flex:1}
.cal-nav{display:flex;align-items:center;gap:2px}
.tbtn{padding:5px 12px;border-radius:8px;font-size:13px;font-weight:500;box-shadow:0 0 0 1px var(--line)}
.tbtn:hover{background:var(--sunk)}
.cal-split{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 288px;gap:28px}
.month{display:flex;flex-direction:column;min-height:0}
.wds{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:0 0 6px}
.wds div{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding:0 8px}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cell{background:var(--panel);padding:6px 6px 5px;display:flex;flex-direction:column;gap:3px;min-width:0;min-height:0;overflow:hidden;cursor:pointer}
.cell:hover{background:color-mix(in srgb,var(--sunk) 55%,var(--panel))}
.cell.out{background:var(--bg)}
.cell.out .dn{color:var(--faint)}
.cell.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cell.drop{background:var(--accent-soft)}
.dn{font-size:12.5px;font-variant-numeric:tabular-nums;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;color:var(--muted);flex:none}
.cell.today .dn{background:var(--accent);color:var(--panel);font-weight:600}
.ev{display:flex;align-items:center;gap:6px;min-width:0;font-size:12px;line-height:1.3;padding:3px 7px;border-radius:6px;background:color-mix(in srgb,var(--c) 13%,var(--panel));color:var(--fg);cursor:grab}
.ev i{width:6px;height:6px;border-radius:50%;background:var(--c);flex:none}
.ev span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.done{opacity:.5}
.ev.done span{text-decoration:line-through}
.ev.late span{color:var(--danger)}
.ev.cur{box-shadow:0 0 0 1.5px var(--c)}
.ev.ghost{background:none;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent);color:var(--muted)}
.ev.ghost i{display:none}
.ev em{font-style:normal;font-size:9.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--c);flex:none}
.ev.ghost.cur{box-shadow:inset 0 0 0 1.5px var(--c)}
.seg.sm button{padding:4px 10px;font-size:12.5px}
.ag-group{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding:18px 4px 4px}
.picks{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.pick{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:9px;cursor:pointer;text-align:left;width:100%}
.pick:hover{background:var(--hover)}
.pick .dot{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.pick .pt{flex:1;min-width:0}
.pick .pt b{display:block;font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .pt small{display:block;color:var(--muted);font-size:12px}
.pick .pt small.late{color:var(--danger)}
.pick .add{flex:none;display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;color:var(--accent);padding:4px 8px;border-radius:7px;background:var(--accent-soft)}
.show-all{font-size:12.5px;color:var(--muted);padding:6px 8px}
.show-all:hover{color:var(--fg)}
.more{font-size:11.5px;color:var(--muted);padding:0 7px}
.agenda{min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 2px 24px}
.ag-day{font-size:20px;line-height:1.1}
.ag-sub{color:var(--muted);font-size:13px;margin:4px 0 12px}
.ag-empty{color:var(--muted);font-size:13.5px;padding:16px 4px}
.agenda .row.open{margin:10px 0;padding:14px}
.agenda .chips,.agenda .steps,.agenda .e-foot{padding-left:0}
.agenda .e-notes{padding-left:0}
.agenda .calpanel{margin-left:0}

/* ---------- settings sheet + toast ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(10,12,16,.4);z-index:80;display:grid;place-items:center;padding:24px}
.sheet{background:var(--panel);border-radius:18px;box-shadow:var(--shadow);width:min(560px,100%);max-height:100%;overflow:auto;-webkit-user-select:text;user-select:text}
.sheet header{display:flex;align-items:center;padding:22px 24px 4px}
.sheet h2{font-size:24px;margin:0;flex:1}
.sheet section{padding:14px 24px 20px;border-top:1px solid var(--line)}
.sheet section:first-of-type{border-top:0}
.sheet h3{margin:4px 0 4px;font-size:15px;display:flex;align-items:center;gap:8px}
.sheet p{margin:4px 0 10px;color:var(--muted);font-size:13.5px;max-width:62ch}
.sheet ol{margin:6px 0 14px;padding-left:20px;color:var(--muted);font-size:13.5px;display:flex;flex-direction:column;gap:5px}
.sheet ol b{color:var(--fg);font-weight:600}
.mem{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.mem-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;background:var(--sunk);font-size:13.5px}
.mem-row span{flex:1}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;font-size:13px;font-weight:600}
.field input,.field select{font-weight:400;font-size:14px;width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none}
.field input:focus,.field select:focus{border-color:var(--accent)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:600}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px;margin:10px 0;cursor:pointer}
.toggle input{width:16px;height:16px;accent-color:var(--accent)}
.msg{font-size:13px;margin-top:8px}
.msg.err{color:var(--danger)} .msg.ok{color:#22a06b}
.link{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--fg);color:var(--panel);padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:90;box-shadow:var(--shadow);max-width:min(520px,90vw);animation:rise .18s ease-out}
@keyframes rise{from{transform:translate(-50%,6px);opacity:0}}

/* ---------- sign-in + sync ---------- */
.auth{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:24px 16px;overflow:auto}
.auth-card{width:min(380px,100%);background:var(--panel);border-radius:18px;box-shadow:var(--shadow);padding:30px 26px 24px;display:flex;flex-direction:column;gap:6px}
.auth-card .brand{font-size:28px;margin-bottom:6px}
.auth-card h2{font-size:20px;margin:6px 0 0;letter-spacing:-.02em}
.auth-sub{color:var(--muted);font-size:14px;margin:0 0 12px;line-height:1.5}
.auth-card .field{margin-bottom:10px}
.auth-card .btn{padding:11px 14px;font-size:14.5px;margin-top:4px}
.auth-links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:13px}
.auth-links button{color:var(--accent);font-weight:600}
.auth-card .msg{margin:0 0 6px}
.auth-card code{font-size:12.5px;background:var(--sunk);padding:1px 5px;border-radius:4px}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;margin:6px 0}
@keyframes spin{to{transform:rotate(360deg)}}
.syncstat{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--faint);min-width:0;padding-right:6px}
.syncstat i{width:6px;height:6px;border-radius:50%;background:#22a06b;flex:none}
.syncstat.saving i{background:var(--star)} .syncstat.off i{background:var(--faint)} .syncstat.err i{background:var(--danger)}
.syncstat span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner .bb{display:flex;gap:6px;margin-left:auto}
.banner .bb button{margin-left:0}
.banner .bb .ghosty{color:var(--muted);font-weight:500}

/* touch screens (iPhone, iPad) */
html{-webkit-tap-highlight-color:transparent}
@media (hover:none){
  .star{opacity:.6} .star.on{opacity:1}
  .step .sx{opacity:1}
}
@media (pointer:coarse){
  input,textarea,select{font-size:16px}
  .search input,.newlist input,.adder input[type=text],.step input,.add-step input,.e-notes{font-size:16px}
}

/* ---------- color layer ---------- */
.brand em{background:linear-gradient(135deg,#6366f1,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand{font-weight:800}
.side{background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 70%,#e9e7ff) 0%,var(--bg) 45%)}
.nav-item{border-radius:10px;padding:6px 10px;gap:10px}
.nav-item .tile{width:20px;height:20px;display:grid;place-items:center;color:var(--c);flex:none}
.nav-item .tile svg.i{width:17px;height:17px;stroke-width:1.7}
.nav-item.on{background:color-mix(in srgb,var(--c,var(--accent)) 13%,var(--panel));box-shadow:none;color:var(--fg)}
.nav-item.on .n{color:color-mix(in srgb,var(--c,var(--accent)) 80%,var(--fg))}
.nav-item .dot{width:9px;height:9px;border-radius:50%;margin:0 5px}
.nav-item .dot.pick{width:20px;height:20px;margin:0;border-radius:50%;background:none;box-shadow:none}
.nav-item .dot.pick::after{width:9px;height:9px;border-radius:50%;background:var(--c)}
.nav-item .dot.pick:hover{background:var(--hover)}
.nav-item .ico-c{width:20px;height:20px;display:grid;place-items:center;color:var(--c)}
.nav-item .ico-c svg.i{width:17px;height:17px;stroke-width:1.7}
.search{border-radius:11px;background:color-mix(in srgb,var(--panel) 75%,transparent);box-shadow:inset 0 0 0 1px var(--line)}
.main{position:relative;border-left:0;border-radius:0;overflow:hidden}
.main::before{content:"";position:absolute;left:0;right:0;top:0;height:260px;pointer-events:none;z-index:0;
  background:radial-gradient(55% 100% at 18% 0%,color-mix(in srgb,var(--accent) 17%,transparent),transparent 72%),
             radial-gradient(45% 90% at 88% 0%,color-mix(in srgb,var(--accent2) 13%,transparent),transparent 70%);
  transition:background .4s}
.main>*{position:relative;z-index:1}
.top{align-items:center}
.vtile{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;color:var(--accent);align-self:flex-start;margin-top:4px;
  background:color-mix(in srgb,var(--accent) 12%,transparent)}
.vtile svg.i{width:22px;height:22px;stroke-width:1.7}
.title{font-weight:800;letter-spacing:-.035em}
.sub{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prog{display:inline-block;width:90px;height:6px;border-radius:99px;background:color-mix(in srgb,var(--accent) 14%,var(--sunk));overflow:hidden;vertical-align:middle}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}
.seg{background:color-mix(in srgb,var(--panel) 70%,var(--sunk));box-shadow:inset 0 0 0 1px var(--line)}
.seg button.on{color:var(--accent);box-shadow:0 2px 6px -2px rgba(40,40,110,.2)}
.adder{border-bottom:0;margin:4px 0 6px;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--panel) 80%,transparent);box-shadow:inset 0 0 0 1px var(--line)}
.adder:focus-within{box-shadow:inset 0 0 0 1.5px var(--accent),0 6px 18px -10px color-mix(in srgb,var(--accent) 70%,transparent)}
.row{border-bottom:0;border-radius:12px;padding:11px 10px;margin:1px -4px}
.row:hover{background:color-mix(in srgb,var(--c,var(--accent)) 7%,transparent)}
.check{border-width:2px;border-color:color-mix(in srgb,var(--c,var(--accent)) 55%,var(--faint))}
.done>.check,.done>.e-head>.check{background:linear-gradient(135deg,var(--c,var(--accent)),color-mix(in srgb,var(--c,var(--accent)) 55%,#ec4899))}
.check svg{transition:transform .18s}
.done>.check svg{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.group{font-weight:700;letter-spacing:.08em;color:color-mix(in srgb,var(--accent) 55%,var(--faint));padding-top:22px}
.group.late{color:var(--danger)}
.group.starred{color:var(--star)}
.row.open{border-radius:20px;border-color:color-mix(in srgb,var(--c,var(--accent)) 25%,var(--line));
  box-shadow:0 24px 50px -24px color-mix(in srgb,var(--c,var(--accent)) 45%,transparent),0 2px 8px -3px rgba(40,40,110,.08);margin:10px -14px}
.chip{border-radius:10px}
.chip.on{background:color-mix(in srgb,var(--accent) 13%,var(--panel));color:color-mix(in srgb,var(--accent) 85%,var(--fg))}
.chip.plan{background:color-mix(in srgb,#8b5cf6 13%,var(--panel));color:color-mix(in srgb,#8b5cf6 85%,var(--fg))}
.chip.sun{background:color-mix(in srgb,#f97316 12%,var(--panel));color:color-mix(in srgb,#f97316 85%,var(--fg))}
.btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn.ghost{background:var(--panel);color:var(--fg)}
.btn.warn{background:none;color:var(--danger)}
.banner{border-radius:14px;background:color-mix(in srgb,var(--accent) 9%,var(--panel));color:color-mix(in srgb,var(--accent) 50%,var(--muted))}
.grid{border-radius:18px}
.cell.today .dn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.cell.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.ev{border-radius:7px}
.empty h3{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.pick .add{border-radius:9px}
.sheet,.auth-card{border-radius:22px}
.toast{border-radius:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 80%,#14152b),color-mix(in srgb,var(--accent2) 70%,#14152b));color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .side{background:linear-gradient(180deg,#141530 0%,var(--bg) 50%)}}
:root[data-theme="dark"] .side{background:linear-gradient(180deg,#141530 0%,var(--bg) 50%)}

/* ---------- Orbit: assistant, notes, schedule ---------- */
.aimode{flex:1;min-height:0;display:flex;flex-direction:column}
.ai-scroll{flex:1;min-height:0;overflow-y:auto}
.ai-col{max-width:780px;margin:0 auto;padding:0 48px}
.ai-dock{padding:8px 0 22px;background:linear-gradient(transparent,var(--panel) 30%)}
.ai-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ai-chips .chip{background:color-mix(in srgb,var(--accent) 9%,var(--panel));color:color-mix(in srgb,var(--accent) 80%,var(--fg));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 18%,transparent)}
.ai-composer{display:flex;align-items:flex-end;gap:10px;padding:10px 10px 10px 16px;border-radius:18px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line),0 10px 30px -18px rgba(40,40,110,.35)}
.ai-composer:focus-within{box-shadow:inset 0 0 0 1.5px var(--accent),0 10px 30px -14px color-mix(in srgb,var(--accent) 60%,transparent)}
.ai-composer textarea{flex:1;min-width:0;border:0;outline:none;background:none;resize:none;font-size:15px;line-height:1.45;max-height:180px;padding:6px 0}
.ai-send{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));flex:none}
.ai-send:disabled{opacity:.4}
.ai-send svg.i{width:18px;height:18px;stroke-width:2.2}
.ai-foot{display:flex;justify-content:center;margin-top:8px;min-height:0}
.ai-foot:empty{display:none}
.msg-u{display:flex;justify-content:flex-end;margin:18px 0 6px}
.msg-u div{max-width:80%;padding:10px 14px;border-radius:18px 18px 6px 18px;background:color-mix(in srgb,var(--accent) 12%,var(--panel));color:var(--fg);overflow-wrap:anywhere}
.msg-a{margin:6px 0 10px;max-width:92%}
.md p{margin:0 0 8px;line-height:1.55}
.md ul,.md ol{margin:4px 0 10px;padding-left:20px;line-height:1.55}
.md li{margin:2px 0}
.md .md-h{font-weight:700}
.md code{font-size:13px;background:var(--sunk);padding:1px 5px;border-radius:5px}
.acts{display:flex;flex-direction:column;gap:2px;padding:8px 10px;margin:4px 0 10px;border-radius:14px;background:color-mix(in srgb,var(--accent) 6%,var(--panel));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 14%,transparent);position:relative}
.act{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--fg);padding:2px 64px 2px 0}
.act svg.i{width:15px;height:15px;color:var(--accent);margin-top:2px}
.acts.undone .act{opacity:.45;text-decoration:line-through}
.undo,.undone-l{position:absolute;top:8px;right:10px;font-size:12.5px;font-weight:600;color:var(--accent)}
.undone-l{color:var(--muted);font-weight:500}
.prop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;margin:4px 0 10px;border-radius:14px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line),0 8px 20px -16px rgba(40,40,110,.4)}
.prop>svg.i{width:20px;height:20px;color:var(--accent)}
.prop .pt{flex:1;min-width:160px;display:flex;flex-direction:column}
.prop .pt span{font-size:13px;color:var(--muted)}
.prop .pt em{font-style:normal;font-size:12.5px;color:var(--danger)}
.prop .ok{font-size:13px;font-weight:600;color:#10b981}
.prop.done{opacity:.85}
.ai-err{color:var(--danger);font-size:13.5px;margin:4px 0}
.typing{display:flex;gap:5px;padding:10px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:.35;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.ai-hello,.ai-setup{text-align:center;padding:56px 8px 24px;max-width:520px;margin:0 auto}
.ai-hello h3,.ai-setup h3{font-size:24px;font-weight:800;letter-spacing:-.03em;margin:14px 0 6px}
.ai-hello p,.ai-setup p{color:var(--muted);margin:0 0 10px}
.ai-setup ol{text-align:left;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:6px;margin:14px 0}
.ai-setup ol b{color:var(--fg)}
.ai-orb{width:56px;height:56px;margin:0 auto;border-radius:18px;display:grid;place-items:center;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.ai-orb svg.i{width:28px;height:28px}
.ai-keyform{display:flex;gap:8px;margin:8px 0}
.ai-keyform input{flex:1;min-width:0;background:var(--sunk);border:1px solid var(--line);border-radius:11px;padding:10px 12px;outline:none;font-size:14px}
.ai-keyform input:focus{border-color:var(--accent)}
.fine{font-size:12px;color:var(--faint)}
body:has(#main.is-ai) .toast{bottom:120px}
.brief{margin:2px 0 8px;padding:14px 16px 6px;border-radius:18px;background:linear-gradient(135deg,color-mix(in srgb,#8b5cf6 9%,var(--panel)),color-mix(in srgb,#ec4899 6%,var(--panel)));box-shadow:inset 0 0 0 1px color-mix(in srgb,#8b5cf6 16%,transparent)}
.brief-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8b5cf6;margin-bottom:6px}
.brief-h svg.i{width:15px;height:15px}
.brief-h .sp{flex:1}
.ib.sm{width:26px;height:26px}
.ib.sm svg.i{width:14px;height:14px}
.brief-b{font-size:14px}
.sched{margin:4px 0 4px}
.sched .group{padding-top:14px}
.sched-load{font-size:13px;color:var(--faint);padding:4px 10px 6px}
.evrow{display:flex;align-items:baseline;gap:10px;padding:7px 10px;border-radius:10px;color:var(--fg);text-decoration:none;font-size:14px}
.evrow:hover{background:color-mix(in srgb,var(--c) 8%,transparent)}
.evrow .evt{width:68px;flex:none;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.evrow i{width:3px;align-self:stretch;border-radius:3px;background:var(--c);flex:none}
.evrow .evti{flex:1;min-width:0}
.evrow .evti small{display:block;font-size:12px;color:var(--muted)}
.evrow .evd{font-size:12px;color:var(--faint)}
.cal-cta{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:11px;font-size:13px;font-weight:600;color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent);margin:6px 0}
.cal-cta svg.i{width:15px;height:15px}
.agenda .sched .group{padding:6px 4px 4px}
.note-bar{display:flex;align-items:center;gap:10px;margin:2px 0 14px;flex-wrap:wrap}
.note-bar .sp{flex:1}
.note-search{flex:1;min-width:180px;margin:0}
.note-bar .btn{display:inline-flex;align-items:center;gap:6px}
.note-bar .btn svg.i{width:15px;height:15px}
.tbtn svg.i{width:14px;height:14px;vertical-align:-2px}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 14px}
.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:12.5px;color:color-mix(in srgb,var(--accent) 80%,var(--fg));background:color-mix(in srgb,var(--accent) 9%,transparent)}
.tag.on{background:var(--accent);color:#fff}
.note-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.note-card{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px 16px;border-radius:16px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);min-height:120px;transition:box-shadow .15s,transform .15s}
.note-card:hover{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,var(--line)),0 12px 26px -18px color-mix(in srgb,var(--accent) 60%,transparent);transform:translateY(-1px)}
.note-card b{font-size:15px;font-weight:700;overflow-wrap:anywhere}
.note-card .snip{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.nc-foot{margin-top:auto;display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--faint)}
.nc-foot i{font-style:normal;color:color-mix(in srgb,var(--accent) 75%,var(--fg))}
.nc-foot em{font-style:normal;margin-left:auto}
.note-ed{display:flex;flex-direction:column;gap:8px}
.note-title{border:0;outline:none;background:none;font-size:24px;font-weight:800;letter-spacing:-.025em;padding:4px 0}
.note-body{border:0;outline:none;background:none;resize:none;font-size:15px;line-height:1.65;min-height:240px;padding:0;overflow:hidden}
.note-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--faint);padding:10px 0;border-top:1px solid var(--line)}
.note-meta .sp{flex:1}
.search-notes{margin-bottom:6px}

.scrim{display:none}
@media (max-width:1100px){
  .cal-split{flex:none;grid-template-columns:minmax(0,1fr);gap:24px}
  .calmode{overflow-y:auto}
  .month{min-height:auto}
  .grid{flex:none}
  .agenda{overflow:visible;padding-bottom:40px}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .main{border-left:0}

<script>
(() => {
const isDesktop = !!(window.tally && window.tally.load);       // running inside the Mac app
const isCloud = window.TALLY_MODE === "cloud" && !!window.TallyCloud;
const touch = matchMedia("(hover: none)").matches;   // tasks sync through Firebase
const root = document.documentElement;
if (isDesktop) root.classList.add("desktop");
if (isDesktop && window.tally.platform === "darwin") root.classList.add("mac");

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const COLORS = ["#3552f2","#0ea5e9","#0aa2b5","#1f9d6b","#65a30d","#b7791f","#ef7d1a","#dc2626","#e0527c","#c026d3","#8b5cf6","#6b7280"];
const icon = (id, cls = "i") => `<svg class="${cls}"><use href="#${id}"/></svg>`;

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => iso(new Date());
const addDays = n => { const d = new Date(); d.setDate(d.getDate()+n); return iso(d); };
const parseISO = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
function dueLabel(s){
  const t = today();
  if (s === t) return {text:"Today", cls:"soon"};
  if (s === addDays(1)) return {text:"Tomorrow", cls:""};
  if (s === addDays(-1)) return {text:"Yesterday", cls:"late"};
  const d = parseISO(s), opts = {weekday:"short", month:"short", day:"numeric"};
  if (d.getFullYear() !== new Date().getFullYear()) opts.year = "numeric";
  return {text: d.toLocaleDateString(undefined, opts), cls: s < t ? "late" : ""};
}
const lc = s => ["Today","Tomorrow","Yesterday"].includes(s) ? s.toLowerCase() : s;   // "Due today", "Do Tue, Oct 20"
function relDays(s){
  const n = Math.round((parseISO(s) - parseISO(today())) / 864e5);
  if (n === 0) return "Today"; if (n === 1) return "Tomorrow"; if (n === -1) return "Yesterday";
  return n > 0 ? `In ${n} days` : `${-n} days ago`;
}

/* ---------- typed dates: "essay due friday", "read ch 4 tmrw", "lab 10/20" ---------- */
const WD = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
const WD_ALIAS = {tues:2, weds:3, thur:4, thurs:4};
const MONTHS = ["january","february","march","april","may","june","july","august","september","october","november","december"];
function parseDateWords(s){
  s = s.toLowerCase().replace(/[.,!]+$/,"").trim();
  const now = new Date(); now.setHours(0,0,0,0);
  if (/^(today|tonight|tod)$/.test(s)) return today();
  if (/^(tomorrow|tmrw|tmr|tmw)$/.test(s)) return addDays(1);
  if (s === "next week") return addDays(7);
  let m = s.match(/^in (\d{1,2}) (day|days|week|weeks)$/);
  if (m) return addDays(+m[1] * (m[2].startsWith("week") ? 7 : 1));
  m = s.match(/^(?:next |this )?([a-z]+)$/);
  if (m) {
    const w = m[1]; let idx = WD_ALIAS[w];
    if (idx == null && w.length >= 3) idx = WD.findIndex(d => d.startsWith(w));
    if (idx != null && idx >= 0) { let diff = (idx - now.getDay() + 7) % 7 || 7; return addDays(diff); }
  }
  m = s.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);
  let mo, da, yr;
  if (m) { mo = +m[1]; da = +m[2]; yr = m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : null; }
  else {
    m = s.match(/^([a-z]{3,9})\.? (\d{1,2})(?:st|nd|rd|th)?$/) || s.match(/^(\d{1,2})(?:st|nd|rd|th)? ([a-z]{3,9})$/);
    if (m) {
      const word = isNaN(+m[1]) ? m[1] : m[2], num = isNaN(+m[1]) ? +m[2] : +m[1];
      const mi = MONTHS.findIndex(x => x.startsWith(word) && word.length >= 3 && (word === "sept" || x.startsWith(word)));
      if (mi >= 0) { mo = mi + 1; da = num; yr = null; }
    }
  }
  if (mo && da && mo <= 12 && da <= 31) {
    let y = yr || now.getFullYear();
    let d = new Date(y, mo - 1, da);
    if (d.getMonth() !== mo - 1) return null;
    if (!yr && d < new Date(now.getTime() - 864e5 * 14)) d = new Date(y + 1, mo - 1, da);
    return iso(d);
  }
  return null;
}
function parseTitle(text){
  const words = text.trim().split(/\s+/);
  for (const n of [3, 2, 1]) {
    if (words.length <= n) continue;
    const cand = words.slice(-n).join(" ");
    if (/\b[A-Z]{2,}\b/.test(cand)) continue;   // "SAT", "FRI" in caps are names, not dates
    const due = parseDateWords(cand);
    if (!due) continue;
    const rest = words.slice(0, -n);
    let kw = "";
    if (rest.length > 1 && /^(due|by|on|before)$/i.test(rest[rest.length-1])) kw = rest.pop().toLowerCase();
    if (!rest.length) continue;
    return {title: rest.join(" "), due, isDue: kw === "due" || kw === "by" || kw === "before"};
  }
  return null;
}

/* ---------- data ---------- */
function exampleState(){
  const now = Date.now(), ex = {example:true, notes:"", steps:[], done:false, important:false, plan:null, due:null};
  return { v:2,
    lists:[
      {id:"inbox", name:"Tasks", color:"#6b7280"},
      {id:"ex-school", name:"School", color:"#3552f2", example:true},
      {id:"ex-home", name:"Home", color:"#1f9d6b", example:true},
    ],
    tasks:[
      {...ex, id:uid(), listId:"inbox", title:"Click a task to open it", plan:today(), notes:"Notes, steps and dates live in here. This is an example task.", created:now},
      {...ex, id:uid(), listId:"inbox", title:"Type a date at the end of a new task, like “quiz friday”", plan:today(), created:now-1},
      {...ex, id:uid(), listId:"ex-school", title:"History essay draft", due:addDays(3), plan:addDays(1), important:true, created:now-2, steps:[
        {id:uid(), title:"Outline the argument", done:true}, {id:uid(), title:"Write the introduction", done:false}, {id:uid(), title:"Cite five sources", done:false}]},
      {...ex, id:uid(), listId:"ex-school", title:"Read chapter 4", due:addDays(1), created:now-3},
      {...ex, id:uid(), listId:"ex-school", title:"Problem set 6", due:addDays(-1), created:now-4},
      {...ex, id:uid(), listId:"ex-school", title:"Lab report", due:addDays(9), plan:addDays(6), created:now-5},
      {...ex, id:uid(), listId:"ex-home", title:"Renew library books", due:addDays(5), created:now-6},
      {...ex, id:uid(), listId:"ex-home", title:"Laundry", plan:today(), done:true, completedAt:now-7, created:now-7},
    ]};
}

let S = isCloud ? {v:2, lists:[], tasks:[], notes:[], prefs:{}} : exampleState(), loaded = false;
const ui = {view:"today", mode:"list", plannerMode:"cal", calKind:"due", trayAll:false, sel:null, q:"", showDone:true, addImportant:false, addDue:null, noParse:false,
  popOpen:false, delArm:null, calMonth:null, calDay:today(), dueEdit:false, addDueEdit:false, calMenu:null};
try { const u = JSON.parse(localStorage.getItem("tally-ui") || "null");
  if (u) { ui.view = u.view || ui.view; ui.mode = u.mode === "cal" ? "cal" : "list"; ui.calKind = u.calKind === "plan" ? "plan" : "due"; ui.plannerMode = u.plannerMode === "list" ? "list" : "cal"; ui.showDone = u.showDone ?? true; } } catch(e){}
const LEGACY = {myday:"today", planned:"upcoming", important:"starred"};
if (LEGACY[ui.view]) ui.view = LEGACY[ui.view];

const SMART = {
  today:    {name:"Today",     icon:"i-sun",      c:"#f97316", c2:"#f43f5e",      match:t => t.plan === today() || t.due === today() || (!t.done && ((!!t.due && t.due < today()) || (!!t.plan && t.plan < today())))},
  planner:  {name:"Planner",   icon:"i-plan",     c:"#8b5cf6", c2:"#ec4899",     match:t => !!(t.plan || t.due)},
  upcoming: {name:"Upcoming",  icon:"i-upcoming", c:"#0ea5e9", c2:"#6366f1", match:t => !!t.due},
  starred:  {name:"Starred",   icon:"i-star",     c:"#f59e0b", c2:"#f97316",     match:t => t.important},
  all:      {name:"All tasks", icon:"i-stack",    c:"#14b8a6", c2:"#0ea5e9",    match:() => true},
};
const listById = id => S.lists.find(l => l.id === id);
const taskById = id => S.tasks.find(t => t.id === id);
const colorOf = t => listById(t.listId)?.color || COLORS[0];
const viewTasks = v => SMART[v] ? S.tasks.filter(SMART[v].match) : S.tasks.filter(t => t.listId === v);
const viewName = v => SMART[v] ? SMART[v].name : SPECIAL[v] ? SPECIAL[v].name : (listById(v)?.name || "Tasks");
const isCustom = v => !SMART[v] && !SPECIAL[v] && v !== "inbox";
function ensureShape(){
  if (!Array.isArray(S.lists)) S.lists = [];
  if (!Array.isArray(S.tasks)) S.tasks = [];
  if (!Array.isArray(S.notes)) S.notes = [];
  if (!S.prefs || typeof S.prefs !== "object") S.prefs = {};
  if (!S.lists.some(l => l.id === "inbox")) S.lists.unshift({id:"inbox", name:"Tasks", color:"#6b7280"});
  for (const t of S.tasks) {            // older versions called the do-date "myDay"
    if ("myDay" in t) { if (t.myDay && !t.plan) t.plan = t.myDay; delete t.myDay; }
    if (!("plan" in t)) t.plan = null;
  }
}

/* ---------- saving ---------- */
const LS_KEY = "tally-tasks-v1";
let saveTimer = null, saving = false, saveAgain = false, dirty = false, dbRef = null, lastWritten = "";
function saveUi(){ try { localStorage.setItem("tally-ui", JSON.stringify({view:ui.view, mode:ui.mode, plannerMode:ui.plannerMode, calKind:ui.calKind, showDone:ui.showDone})); } catch(e){} }
function persist(){
  saveUi();
  if (!loaded) return;
  dirty = true;
  if (isDesktop) calQueue();
  if (isCloud) { schedulePush(); return; }
  if (!isDesktop) { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){} }
  clearTimeout(saveTimer); saveTimer = setTimeout(flush, isDesktop ? 300 : 600);
}
async function flush(){
  saveTimer = null;
  if (saving) { saveAgain = true; return; }
  saving = true;
  const body = JSON.stringify(S);
  try {
    if (isDesktop) await window.tally.save(S);
    else if (dbRef && body !== lastWritten) { await dbRef.set(JSON.parse(body)); lastWritten = body; }
    if (JSON.stringify(S) === body) dirty = false;
  } catch(e) { if (isDesktop) toast("Couldn't save your tasks: " + e.message); }
  saving = false;
  if (saveAgain) { saveAgain = false; flush(); }
}
window.addEventListener("beforeunload", () => {
  if (isCloud) { if (pushTimer) { clearTimeout(pushTimer); pushCloud(); } return; }
  if (saveTimer && isDesktop) { clearTimeout(saveTimer); window.tally.save(S); }
});

async function bootDesktop(){
  try { const d = await window.tally.load(); if (d && Array.isArray(d.lists)) S = d; }
  catch(e){ toast("Couldn't open your saved tasks: " + e.message); }
  loaded = true; ensureShape(); render(); flush();
  await desktopExtras();
}
async function desktopExtras(){
  $("#sideFoot").hidden = false;
  window.tally.onMenu(cmd => {
    if (cmd === "settings") openSettings();
    if (cmd === "find") { $("#search").focus(); $("#search").select(); }
    if (cmd === "newList") $("#newListInput").focus();
    if (cmd === "newTask") { if (ui.q) clearSearch(); setMode("list"); $("#addInput").focus(); }
    if (cmd === "modeList") setMode("list");
    if (cmd === "modeCal") setMode("cal");
    if (cmd === "planner") setView("planner");
    if (cmd === "assistant" && aiAllowed) setView("assistant");
    if (cmd === "notes") setView("notes");
  });
  await refreshG();
}
async function bootWeb(){
  try { const d = JSON.parse(localStorage.getItem(LS_KEY) || "null"); if (d && Array.isArray(d.lists)) S = d; } catch(e){}
  loaded = true; ensureShape(); render();
  try {
    if (!window.claude || !claude.use) return;
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const ref = db.collection("data/users/" + id).doc("tally");
    const snap = await ref.get();
    if (snap.exists && Array.isArray(snap.data().lists)) {
      S = JSON.parse(JSON.stringify(snap.data())); ensureShape();
      lastWritten = JSON.stringify(S);
      try { localStorage.setItem(LS_KEY, lastWritten); } catch(e){}
      dbRef = ref; render();
    } else { dbRef = ref; await flush(); }
    ref.onSnapshot(s => {
      if (!s.exists || s.metadata.hasPendingWrites || saving || dirty) return;
      const body = JSON.stringify(s.data());
      if (body === lastWritten || body === JSON.stringify(S)) return;
      if (document.activeElement && document.activeElement.closest(".row.open,.adder,.heading,form")) return;
      S = JSON.parse(body); ensureShape(); lastWritten = body; render();
    }, () => {});
  } catch(e) {}
}

/* ---------- cloud sync (Firebase): one document per list and per task ---------- */
let cloudUser = null, cloudReady = false, cloudUnsub = null, pushTimer = null, renderQueued = false, moveOffer = null;
const synced = {lists: new Map(), tasks: new Map(), notes: new Map(), settings: new Map()};   // id -> canonical JSON last seen on the server side
const seen = {lists: false, tasks: false};
function sortKeys(v){
  if (Array.isArray(v)) return v.map(sortKeys);
  if (v && typeof v === "object") { const o = {}; for (const k of Object.keys(v).sort()) if (v[k] !== undefined) o[k] = sortKeys(v[k]); return o; }
  return v;
}
const canon = o => JSON.stringify(sortKeys(o));
const plain = o => JSON.parse(JSON.stringify(o));
const byOrder = (a, b) => (a.id === "inbox" ? -1 : b.id === "inbox" ? 1 : 0) || ((a.order ?? 1e9) - (b.order ?? 1e9));
function schedulePush(){ clearTimeout(pushTimer); pushTimer = setTimeout(pushCloud, 350); }
function pushCloud(){
  pushTimer = null;
  if (!cloudReady || !cloudUser) return;
  S.lists.forEach((l, i) => { l.order = i; });
  const ops = [];
  for (const [col, arr] of [["lists", S.lists], ["tasks", S.tasks], ["notes", S.notes], ["settings", [{...S.prefs, id: "main"}]]]) {
    const map = synced[col], ids = new Set();
    for (const o of arr) {
      ids.add(o.id);
      const j = canon(o);
      if (map.get(o.id) !== j) { map.set(o.id, j); ops.push({col, id: o.id, data: plain(o)}); }
    }
    for (const id of [...map.keys()]) if (!ids.has(id)) { map.delete(id); ops.push({col, id, data: null}); }
  }
  if (!ops.length) return;
  setSync(navigator.onLine === false ? "off" : "saving");
  TallyCloud.commit(cloudUser.uid, ops).then(() => setSync("ok"), e => setSync("err", e.message));
}
function applyChanges(col, changes){
  if (col === "settings") {
    let touched = false;
    for (const c of changes) {
      if (c.id !== "main") continue;
      if (c.type === "removed") { synced.settings.delete("main"); continue; }
      const data = {...c.data, id: "main"}, j = canon(data);
      if (synced.settings.get("main") === j) continue;
      synced.settings.set("main", j);
      const {id, ...rest} = data; S.prefs = rest; touched = true;
    }
    return touched;
  }
  const arr = col === "lists" ? S.lists : col === "notes" ? S.notes : S.tasks, map = synced[col];
  let touched = false;
  for (const c of changes) {
    const i = arr.findIndex(o => o.id === c.id);
    if (c.type === "removed") { map.delete(c.id); if (i >= 0) { arr.splice(i, 1); touched = true; if (ui.sel === c.id) ui.sel = null; } continue; }
    const data = {...c.data, id: c.id}, j = canon(data);
    if (map.get(c.id) === j) continue;            // our own write coming back
    map.set(c.id, j);
    if (i >= 0) { if (canon(arr[i]) === j) continue; arr[i] = data; } else arr.push(data);
    touched = true;
  }
  return touched;
}
function scheduleRender(){ if (renderQueued) return; renderQueued = true; requestAnimationFrame(() => { renderQueued = false; render(); }); }
function onCloud(col, changes, meta){
  const touched = applyChanges(col, changes);
  if (!meta.fromCache || changes.length) seen[col] = true;
  if (!cloudReady) { if (seen.lists && seen.tasks) cloudBecameReady(); return; }
  if (!meta.fromCache && !meta.pending && navigator.onLine !== false) setSync("ok");
  if (touched) { S.lists.sort(byOrder); ensureShape(); scheduleRender(); if (isDesktop) calQueue(); }
}
function startSync(user){
  cloudUser = user; cloudReady = false; seen.lists = seen.tasks = false;
  for (const m of Object.values(synced)) m.clear();
  S = {v:2, lists: [], tasks: [], notes: [], prefs: {}};
  cloudUnsub = TallyCloud.watch(user.uid, {
    lists: (c, m) => onCloud("lists", c, m),
    tasks: (c, m) => onCloud("tasks", c, m),
    notes: (c, m) => onCloud("notes", c, m),
    settings: (c, m) => onCloud("settings", c, m),
    calTrash: c => onCalTrash(c),
    error: e => {
      setSync("err", e.message);
      if (/permission|insufficient/i.test(e.code + e.message)) showAuth({mode:"rules"});
    },
  });
  // offline with a cached copy: start after a moment instead of waiting for the server
  setTimeout(() => { if (cloudUser === user && !cloudReady && (seen.lists || seen.tasks || navigator.onLine === false)) cloudBecameReady(); }, 3500);
}
function cloudBecameReady(){
  cloudReady = true; loaded = true;
  S.lists.sort(byOrder); ensureShape();
  showAuth(null); render(); pushCloud();
  setSync(navigator.onLine === false ? "off" : "ok");
  if (isDesktop) { offerMove(); calQueue(); }
  if (Cal.hasClient()) Cal.preload();
}
function setSync(state, msg){
  const el = $("#syncStat"); if (!el || !isCloud) return;
  el.hidden = false;
  el.className = "syncstat " + state;
  const label = {ok:"Synced", saving:"Saving…", off:"Offline · saved here", err:"Not synced"}[state] || "";
  el.querySelector("span").textContent = label;
  el.title = state === "err" ? (msg || "Couldn't sync. Changes are kept on this device.") : state === "off" ? "You're offline. Changes sync when you reconnect." : "";
}
window.addEventListener("online", () => { if (isCloud && cloudReady) { setSync("saving"); pushCloud(); setTimeout(() => setSync("ok"), 1500); } });
window.addEventListener("offline", () => { if (isCloud && cloudReady) setSync("off"); });

/* moving tasks that were saved on this Mac before syncing */
async function offerMove(){
  const key = "tally-moved-" + cloudUser.uid;
  try { if (localStorage.getItem(key)) return; } catch(e){}
  let local = null; try { local = await window.tally.load(); } catch(e){}
  const real = local && Array.isArray(local.tasks) ? local.tasks.filter(t => !t.example) : [];
  if (!real.length) { try { localStorage.setItem(key, "nothing"); } catch(e){} return; }
  moveOffer = {local, count: real.length}; render();
}
function doMove(){
  const local = moveOffer.local;
  const haveL = new Set(S.lists.map(l => l.id)), haveT = new Set(S.tasks.map(t => t.id));
  const exLists = new Set((local.lists || []).filter(l => l.example).map(l => l.id));
  for (const l of local.lists || []) if (!haveL.has(l.id) && !l.example) S.lists.push({...l});
  let n = 0;
  for (const t of local.tasks) {
    if (t.example || haveT.has(t.id)) continue;
    const c = {...t};
    if (exLists.has(c.listId) || !S.lists.some(l => l.id === c.listId)) c.listId = "inbox";
    S.tasks.push(c); n++;
  }
  ensureShape();
  try { localStorage.setItem("tally-moved-" + cloudUser.uid, String(Date.now())); } catch(e){}
  moveOffer = null; commit();
  toast(`Moved ${n} task${n === 1 ? "" : "s"} into your synced Orbit. They're on your other devices now.`);
}
function skipMove(){ try { localStorage.setItem("tally-moved-" + cloudUser.uid, "skipped"); } catch(e){} moveOffer = null; render(); }

/* a phone can't reach Google Calendar, so it leaves deleted events here for the Mac app to remove */
async function onCalTrash(changes){
  if (!isDesktop) return;
  for (const c of changes) {
    if (c.type !== "added") continue;
    if (!G.connected) continue;
    try { await window.tally.gcal.deleteEvent({calendarId: c.data.calendarId, eventId: c.data.eventId}); } catch(e) { continue; }
    TallyCloud.commit(cloudUser.uid, [{col:"calTrash", id:c.id, data:null}]).catch(() => {});
  }
}

/* sign-in screen */
let authUi = null;
function showAuth(state){ authUi = state; renderAuth(); }
function renderAuth(){
  const slot = $("#authSlot");
  if (!authUi) { slot.innerHTML = ""; return; }
  const f = captureFocus();
  const a = authUi, brand = `<div class="brand">orbit<em>.</em></div>`;
  const msg = a.msg ? `<div class="msg ${a.msgType || "err"}">${esc(a.msg)}</div>` : "";
  let body;
  if (a.mode === "loading") body = `${brand}<p class="auth-sub">Opening your tasks…</p><div class="spin" aria-label="Loading"></div>`;
  else if (a.mode === "setup") body = `${brand}<h2>Almost set up</h2><p class="auth-sub">This copy of Orbit doesn't have your Firebase settings yet. Paste them into <code>firebase-config.js</code>, as in the setup steps, then reload this page.</p>`;
  else if (a.mode === "rules") body = `${brand}<h2>Firebase blocked access</h2><p class="auth-sub">You're signed in, but the database rules don't allow reading your tasks. In Firebase, open Firestore Database › Rules, paste the rules from the setup steps, click Publish, then reload.</p><button class="btn" id="authReload">Reload</button><div class="auth-links"><button id="authOut">Sign out</button></div>`;
  else {
    const up = a.mode === "signup", reset = a.mode === "reset";
    body = `${brand}
      <h2>${reset ? "Reset your password" : up ? "Create your account" : "Sign in"}</h2>
      <p class="auth-sub">${reset ? "We'll email you a link to choose a new password." : up ? "Use this same email and password on your Mac, iPhone and iPad to keep them in sync." : "Your tasks sync across your Mac, iPhone and iPad."}</p>
      <form id="authForm">
        <label class="field">Email<input id="authEmail" type="email" autocomplete="username" value="${esc(a.email || "")}" required></label>
        ${reset ? "" : `<label class="field">Password<input id="authPw" type="password" autocomplete="${up ? "new-password" : "current-password"}" ${up ? 'minlength="6"' : ""} required></label>`}
        ${msg}
        <button class="btn" type="submit" ${a.busy ? "disabled" : ""}>${a.busy ? "One moment…" : reset ? "Send reset link" : up ? "Create account" : "Sign in"}</button>
      </form>
      <div class="auth-links">
        ${reset || up ? `<button id="authToIn">Back to sign in</button>` : `<button id="authToUp">Create an account</button><button id="authToReset">Forgot password?</button>`}
      </div>`;
  }
  slot.innerHTML = `<div class="auth" role="dialog" aria-modal="true" aria-label="Sign in"><div class="auth-card">${body}</div></div>`;
  restoreFocus(f);
  if (!f && $("#authEmail")) (a.email ? $("#authPw") || $("#authEmail") : $("#authEmail")).focus();
}
$("#authSlot").addEventListener("submit", async e => {
  e.preventDefault();
  const email = $("#authEmail").value.trim(), pw = $("#authPw")?.value || "";
  const mode = authUi.mode;
  showAuth({...authUi, email, busy: true, msg: ""});
  try {
    if (mode === "reset") { await TallyCloud.reset(email); showAuth({mode:"signin", email, msg:"Check your email for the reset link.", msgType:"ok"}); }
    else if (mode === "signup") await TallyCloud.signUp(email, pw);
    else await TallyCloud.signIn(email, pw);
  } catch(err) { showAuth({...authUi, email, busy: false, msg: err.message, msgType: "err"}); }
});
$("#authSlot").addEventListener("click", e => {
  const id = e.target.closest("button")?.id, email = $("#authEmail")?.value.trim() || authUi?.email || "";
  if (id === "authToUp") showAuth({mode:"signup", email});
  if (id === "authToIn") showAuth({mode:"signin", email});
  if (id === "authToReset") showAuth({mode:"reset", email});
  if (id === "authReload") location.reload();
  if (id === "authOut") TallyCloud.signOut();
});
async function bootCloud(){
  $("#sideFoot").hidden = false;
  $("#gstat").hidden = true;   // calendar status lives in Settings; the footer shows sync status
  if (isDesktop) await desktopExtras();
  if (!TallyCloud.configured || !TallyCloud.init()) return showAuth({mode:"setup"});
  showAuth({mode:"loading"});
  TallyCloud.onAuth(user => {
    if (cloudUnsub) { cloudUnsub(); cloudUnsub = null; }
    if (!user) {
      cloudUser = null; cloudReady = false; loaded = false; moveOffer = null; ui.sel = null;
      S = {v:2, lists: [], tasks: [], notes: [], prefs: {}}; render();
      return showAuth({mode:"signin"});
    }
    showAuth({mode:"loading"});
    startSync(user);
  });
}

function toast(msg){
  const slot = $("#toastSlot");
  slot.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => slot.innerHTML = "", 3600);
}

/* ---------- render ---------- */
function captureFocus(){ const a = document.activeElement; if (!a || !a.id || a === document.body) return null; let s=null,e=null; try { s=a.selectionStart; e=a.selectionEnd; } catch(x){} return {id:a.id, s, e}; }
function restoreFocus(f){ if (!f) return; const el = document.getElementById(f.id); if (!el || el === document.activeElement) return; el.focus({preventScroll:true}); try { if (f.s != null) el.setSelectionRange(f.s, f.e); } catch(x){} }

function render(){
  if (LEGACY[ui.view]) ui.view = LEGACY[ui.view];
  if (!SMART[ui.view] && !SPECIAL[ui.view] && !listById(ui.view)) ui.view = "today";
  if (ui.view === "assistant" && !aiAllowed) ui.view = "today";
  if (ui.sel && !taskById(ui.sel)) ui.sel = null;
  const f = captureFocus();
  renderNav(); renderMain();
  restoreFocus(f);
  document.querySelectorAll("textarea.auto").forEach(autosize);
}
function autosize(ta){ ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; }

function renderNav(){
  const open = t => !t.done, on = v => ui.view === v && !ui.q;
  let h = "";
  for (const k of NAV_ORDER) {
    const v = SMART[k] || SPECIAL[k];
    if (k === "assistant" && !aiAllowed) continue;
    const n = k === "planner" || k === "assistant" ? 0 : k === "notes" ? 0 : viewTasks(k).filter(open).length;
    const late = k === "today" && S.tasks.some(t => !t.done && t.due && t.due < today());
    h += `<button class="nav-item ${on(k)?"on":""}" data-view="${k}" style="--c:${v.c};--c2:${v.c2}"><span class="tile">${icon(v.icon)}</span><span class="nm">${v.name}</span><span class="n ${late?"late":""}">${n||""}</span></button>`;
  }
  h += `<div class="nav-label">Lists</div>`;
  for (const l of S.lists) {
    const n = viewTasks(l.id).filter(open).length;
    const ico = l.id === "inbox"
      ? `<span class="ico-c" data-colorfor="${l.id}" role="button" tabindex="0" aria-label="Change color of ${esc(l.name)}" title="Change color">${icon("i-inbox")}</span>`
      : `<span class="dot pick" data-colorfor="${l.id}" role="button" tabindex="0" aria-label="Change color of ${esc(l.name)}" title="Change color"></span>`;
    h += `<button class="nav-item ${on(l.id)?"on":""}" data-view="${l.id}" data-list="${l.id}" style="--c:${l.color}">${ico}<span class="nm">${esc(l.name)}</span><span class="n">${n||""}</span></button>`;
  }
  $("#nav").innerHTML = h;
}

const DEFAULT_INBOX = "#6b7280";
function viewColors(v){
  if (SMART[v]) return [SMART[v].c, SMART[v].c2];
  if (SPECIAL[v]) return [SPECIAL[v].c, SPECIAL[v].c2];
  const c = listAccent(v); return c ? [c, `color-mix(in srgb, ${c} 55%, #a855f7)`] : null;
}
function listAccent(v){
  const l = !SMART[v] && listById(v);
  if (!l || (l.id === "inbox" && l.color === DEFAULT_INBOX)) return null;
  return l.color;
}
function renderMain(){
  const searching = !!ui.q, planner = ui.view === "planner" && !searching;
  const cal = planner ? ui.plannerMode === "cal" : (ui.mode === "cal" && !searching && ui.view !== "today");
  const vc = searching ? null : viewColors(ui.view), m = $("#main");
  if (vc) { m.style.setProperty("--accent", vc[0]); m.style.setProperty("--accent2", vc[1]); m.style.setProperty("--accent-soft", `color-mix(in srgb, ${vc[0]} 15%, var(--panel))`); }
  else { m.style.removeProperty("--accent"); m.style.removeProperty("--accent2"); m.style.removeProperty("--accent-soft"); }
  $("#vtile").innerHTML = icon(searching ? "i-search" : SMART[ui.view] ? SMART[ui.view].icon : SPECIAL[ui.view] ? SPECIAL[ui.view].icon : ui.view === "inbox" ? "i-inbox" : "i-rows");
  const special = !searching && SPECIAL[ui.view];
  $("#notesMode").hidden = !(special && ui.view === "notes");
  $("#aiMode").hidden = !(special && ui.view === "assistant");
  $("#aiNew").hidden = !(special && ui.view === "assistant" && AI.items.length);
  $("#main").classList.toggle("is-ai", !!special && ui.view === "assistant");
  if (special) {
    $("#main").classList.remove("is-cal");
    const title = $("#title"); if (document.activeElement !== title) title.value = viewName(ui.view); title.readOnly = true; title.title = "";
    $("#modeSeg").hidden = true; $("#moreBtn").hidden = true; $("#listMode").hidden = true; $("#calMode").hidden = true;
    $("#sub").innerHTML = ui.view === "notes" ? `${S.notes.length ? `${S.notes.length} note${S.notes.length === 1 ? "" : "s"}` : "Ideas, class notes, things to remember"}`
      : aiReady() ? "Your personal assistant. It can see your tasks, notes and calendar." : "Set up your free assistant";
    if (ui.view === "notes") renderNotes(); else renderAI();
    renderPop(); return;
  }
  $("#main").classList.toggle("is-cal", cal);
  const title = $("#title"), custom = !searching && isCustom(ui.view);
  if (document.activeElement !== title) title.value = searching ? "Search" : viewName(ui.view);
  title.readOnly = !custom;
  title.title = custom ? "Click to rename" : "";
  $("#modeSeg").hidden = searching || ui.view === "today";
  document.querySelectorAll("#modeSeg button").forEach(b => b.classList.toggle("on", b.dataset.mode === (cal ? "cal" : "list")));
  $("#moreBtn").hidden = searching || planner;
  const vt = searching ? [] : viewTasks(ui.view), open = vt.filter(t => !t.done).length;
  const late = vt.filter(t => !t.done && t.due && t.due < today()).length;
  let sub;
  if (searching) sub = "";
  else if (planner) sub = touch ? (cal ? "What you're doing each day. Tap a day to plan it." : "What you're doing each day. Tap a task, then Plan a day.")
    : cal ? "What you're doing each day. Drag tasks onto a day, or pick a day and plan it." : "What you're doing each day. Drag a task onto a day to plan it.";
  else if (cal) sub = (calKind() === "plan" ? "What you plan to do · " : "When things are due · ") + (calScopeAll() ? "every list" : "only this list");
  else if (ui.view === "today") {
    const total = vt.length, doneN = total - open;
    sub = `<span>${new Date().toLocaleDateString(undefined,{weekday:"long", month:"long", day:"numeric"})}${open ? ` · ${open} to do` : total ? " · all done" : ""}</span>`
      + (total ? `<span class="prog" title="${doneN} of ${total} done"><i style="width:${Math.round(doneN / total * 100)}%"></i></span>` : "");
  }
  else sub = open ? `${open} to do` : (vt.length ? "All done" : "");
  if (!searching && !cal && late && ui.view !== "today") sub += ` · <b>${late} overdue</b>`;
  $("#sub").innerHTML = sub;
  $("#listMode").hidden = cal; $("#calMode").hidden = !cal;
  if (cal) renderCal(); else renderList();
  renderPop();
}

// tasks you've dragged into place keep that order; the rest sort automatically above them
const manual = cmp => (a, b) => {
  const ao = a.order ?? null, bo = b.order ?? null;
  if (ao === null && bo === null) return cmp(a, b);
  if (ao === null) return -1;
  if (bo === null) return 1;
  return (ao - bo) || cmp(a, b);
};
function sortOpen(arr){ return arr.slice().sort(manual((a,b) => (b.important - a.important) || ((a.due||"9") < (b.due||"9") ? -1 : (a.due||"9") > (b.due||"9") ? 1 : 0) || (b.created - a.created))); }

function renderList(){
  const searching = !!ui.q;
  const hasEx = S.tasks.some(t => t.example) || S.lists.some(l => l.example);
  const b = $("#banner"); b.hidden = !(hasEx || moveOffer) || searching;
  b.innerHTML = moveOffer
    ? `<span>This Mac has ${moveOffer.count} task${moveOffer.count === 1 ? "" : "s"} from before you turned on syncing.</span><span class="bb"><button class="ghosty" id="moveNo">Not now</button><button id="moveYes">Move them into my account</button></span>`

function starredHtml(list, rows){ return `<div class="group starred">${icon("i-star")}Starred</div>${rows(list)}`; }

/* ---------- calendar mode ---------- */
const calScopeAll = () => !!SMART[ui.view] && ui.view !== "starred";
const calPool = () => calScopeAll() ? S.tasks : viewTasks(ui.view);

function renderCal(){
  const kind = calKind(), planMode = kind === "plan";
  const mk = ui.calMonth || today().slice(0,7);
  const [y, m] = mk.split("-").map(Number);
  const first = new Date(y, m-1, 1), startOff = first.getDay(), dim = new Date(y, m, 0).getDate();
  const weeks = Math.ceil((startOff + dim) / 7);
  const tdy = today();
  const all = calPool();
  // each day: solid entries (what's on that day) + ghosts (due here, but planned for another day)
  const byDay = {}, ghosts = {};
  for (const t of all) {
    const day = planMode ? doDay(t) : t.due;
    if (day) (byDay[day] ||= []).push(t);
    if (planMode && t.plan && t.due && t.due !== t.plan) (ghosts[t.due] ||= []).push(t);
  }
  const ord = (a,b) => (a.done - b.done) || (b.important - a.important) || (a.created - b.created);
  for (const k in byDay) byDay[k].sort(ord);

  const isLate = (t, day) => !t.done && day < tdy;
  let summary;
  if (planMode) {
    const planned = all.filter(t => !t.done && t.plan && t.plan.startsWith(mk)).length;
    const unplanned = all.filter(t => !t.done && !t.plan).length;
    const behind = all.filter(t => !t.done && doDay(t) && doDay(t) < tdy).length;
    summary = `${planned ? `${planned} planned this month` : "Nothing planned this month"}${unplanned ? ` · ${unplanned} not planned yet` : ""}${behind ? ` · <b>${behind} behind</b>` : ""}`;
  } else {
    const dueThisMonth = all.filter(t => t.due && t.due.startsWith(mk) && !t.done).length;
    const late = all.filter(t => !t.done && t.due && t.due < tdy).length;
    summary = `${dueThisMonth ? `${dueThisMonth} due this month` : "Nothing due this month"}${late ? ` · <b>${late} overdue</b>` : ""}`;
  }
  const wds = Array.from({length:7}, (_,i) => `<div>${new Date(2026,0,4+i).toLocaleDateString(undefined,{weekday:"short"})}</div>`).join("");

        <span class="dot"></span><span class="pt"><b>${esc(t.title)}</b><small class="${late?"late":""}">${l ? esc(l.name) + " · " : ""}${info}</small></span>

    };
    agendaBody = `
      <form class="adder" id="agAdd">${icon("i-plus")}<input type="text" id="agInput" placeholder="Add a task to do ${esc(dayWord)}" maxlength="300" autocomplete="off"></form>

  } else {

      ${agenda}
    </div>`;
}

let cpopFor = null;
function openColorPop(listId, anchor){
  const l = listById(listId); if (!l) return;
  cpopFor = listId; ui.popOpen = false; renderPop();
  const pop = $("#cpop");
  pop.innerHTML = `<div class="pop-label">${esc(l.name)} color</div>${swatchesHtml(l)}`;
  pop.hidden = false;
  const r = anchor.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  let x = r.right + 14, y = r.top - 8;
  if (x + w > innerWidth - 8) x = Math.max(8, r.left - w - 10);
  if (x < 8) x = 8;
  if (y + h > innerHeight - 8) y = innerHeight - h - 8;
  pop.style.left = x + "px"; pop.style.top = Math.max(8, y) + "px";
}
function closeColorPop(){ cpopFor = null; $("#cpop").hidden = true; }
function setListColor(id, c){ const l = listById(id); if (!l || l.color === c) return; l.color = c; commit(); }
function renderPop(){
  const pop = $("#pop"); pop.hidden = !ui.popOpen;
  if (!ui.popOpen) return;
  const l = listById(ui.view), custom = isCustom(ui.view);
  const doneCount = viewTasks(ui.view).filter(t => t.done).length;
  let h = `<button class="row-b" data-pop="hideDone">${icon("i-check")}${ui.showDone ? "Hide" : "Show"} completed</button>`;
  if (doneCount) h += `<button class="row-b" data-pop="clearDone">${icon("i-trash")}Delete ${doneCount} completed</button>`;
  if (l) h += `<hr><div class="pop-label">List color</div>${swatchesHtml(l)}`;
  if (custom && l) {
    h += `<hr><button class="row-b" data-pop="rename">${icon("i-rows")}Rename list</button>`;
    const n = viewTasks(l.id).length;
    h += `<hr><button class="row-b danger" data-pop="delList">${icon("i-trash")}${ui.delArm === "list" ? `Confirm delete${n ? ` (${n} task${n>1?"s":""})` : ""}` : "Delete list"}</button>`;
  }
  pop.innerHTML = h;
}

/* ---------- actions ---------- */
function commit(){ persist(); render(); }
function setView(v){
  if (v !== "notes") ui.noteSel = null;
  if (v === "assistant") setTimeout(() => { if (!touch) $("#aiInput")?.focus(); renderAI(true); }, 0);
  if (v === "planner" && ui.view !== "planner") { ui.calDay = today(); ui.calMonth = null; }
  ui.view = v; clearSearch(true); ui.popOpen = false; ui.delArm = null; ui.sel = null; calDraft = null;
  ui.addDue = null; ui.addImportant = false; ui.addDueEdit = false;
  $("#app").classList.remove("side-open"); commit();
}
function setMode(m){ if (m === "cal" && ui.view === "today") return; if (ui.view === "planner") { ui.plannerMode = m; ui.sel = null; return commit(); } ui.mode = m; ui.sel = null; ui.popOpen = false; calDraft = null; if (ui.q) clearSearch(true); commit(); }
function clearSearch(silent){ ui.q = ""; $("#search").value = ""; if (!silent) render(); }
function toggleDone(t){ t.done = !t.done; t.completedAt = t.done ? Date.now() : null; commit(); }
function openTask(id){ ui.sel = id; ui.delArm = null; calDraft = null; ui.dueEdit = false; ui.planEdit = false; ui.calMenu = null; render(); }
function closeCard(){ ui.sel = null; ui.delArm = null; calDraft = null; ui.dueEdit = false; ui.calMenu = null; render(); }
function newTask(fields){
  const t = {id:uid(), listId:"inbox", title:"", done:false, important:false, plan:null, due:null, notes:"", steps:[], created:Date.now(), ...fields};
  S.tasks.push(t); commit();
  if (t.due && isDesktop && G.connected && G.autoAdd) calAdd(t, {silent:true});
  return t;
}

$("#adder").addEventListener("submit", e => {
  e.preventDefault();
  const raw = $("#addInput").value.trim(); if (!raw) return;
  if (ui.view === "planner") {
    // "essay tue" = do it Tuesday; "essay due thu" = due Thursday, do it then; nothing = do it today
    let title = raw, plan = today(), due = ui.addDue || null;
    const p = (!ui.noParse && !ui.addDue) ? parseTitle(raw) : null;
    if (p) { title = p.title; if (p.isDue) { due = p.due; plan = null; } else plan = p.due; }
    if (due) plan = null;
    newTask({listId:"inbox", title, plan, due, important: ui.addImportant});
    $("#addInput").value = ""; ui.addDue = null; ui.addImportant = false; ui.noParse = false; ui.addDueEdit = false;
    renderAdder(); return;
  }
  let title = raw, due = ui.addDue || null;
  if (!due && !ui.noParse) { const p = parseTitle(raw); if (p) { title = p.title; due = p.due; } }
  const smart = !!SMART[ui.view];
  if (!due && ui.view === "upcoming") due = today();
  const t = newTask({ listId: smart ? "inbox" : ui.view, title, due,
    important: ui.addImportant || ui.view === "starred",
    plan: ui.view === "today" && !due ? today() : null });
  $("#addInput").value = ""; ui.addDue = null; ui.addImportant = false; ui.noParse = false; ui.addDueEdit = false;

});
